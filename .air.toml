# Docker Desktop bind mounts do not consistently forward fsnotify events, so
# polling is intentional here. Air restarts only the local dev process; it is
# never part of the production image.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "make css && go build -o ./tmp/nagipath ./cmd/nagipath"
  entrypoint = ["./tmp/nagipath", "server", "-data", "/data", "-listen", "0.0.0.0:8080"]
  include_ext = ["go", "html", "css", "js", "sql"]
  exclude_dir = [".git", "data", "design", "testlab", "tmp"]
  # app.src.css is watched; app.css is its generated output, so watching both
  # would cause a rebuild loop after every CSS edit.
  exclude_file = ["internal/web/static/app.css"]
  exclude_regex = ["_test\\.go", "internal/web/static/app\\.css$"]
  exclude_unchanged = true
  poll = true
  poll_interval = 500
  delay = 200
  stop_on_error = true
  send_interrupt = true
  kill_delay = "500ms"

[log]
  time = true

[misc]
  clean_on_exit = true
