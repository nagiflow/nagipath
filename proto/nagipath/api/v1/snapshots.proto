syntax = "proto3";

package nagipath.api.v1;

import "google/api/annotations.proto";
import "nagipath/api/v1/nodes.proto";

option go_package = "github.com/nagiflow/nagipath/internal/api/pb;pb";

message SnapshotRow {
  int64 id = 1;
  int64 instance_id = 2;
  string instance = 3;
  string node = 4;
  string cluster = 5;
  string captured_at = 6;
  string trigger = 7;
  bool changed = 8;
  int64 bytes_raw = 9;
  string state = 10;
}

message SnapshotsListResponse {
  repeated SnapshotRow list = 1;
  string query = 2;
  string range = 3;
  string changes = 4;
  string trigger = 5;
  int32 total = 6;
  int64 total_bytes = 7;
  int32 filtered = 8;
  int32 changed = 9;
  int32 degraded = 10;
  string next_cursor = 11;
  bool has_more = 12;
  int32 from = 13;
  int32 to = 14;
  bool empty = 15;
  int32 retention_days = 16;
}

message SnapshotFileResponse {
  Snapshot snapshot = 1;
  Instance instance = 2;
  FileRef file = 3;
  string body = 4;
  int32 byte_start = 5;
  int32 line_start = 6;
  int32 line_end = 7;
  bool has_anchor = 8;
}

message ListSnapshotsRequest {
  string q = 1;
  string range = 2;
  string changes = 3;
  string trigger = 4;
  string cursor = 5;
}

message GetSnapshotFileRequest {
  int64 id = 1;
  int64 file_id = 2;
  string b = 3;
}

// SnapshotService: GET /snapshots and GET /snapshots/{id}/file/{file_id}.
// GET /snapshots?export=csv stays outside this service (api.go) — see
// SiteService's doc comment in sites.proto.
service SnapshotService {
  rpc ListSnapshots(ListSnapshotsRequest) returns (SnapshotsListResponse) {
    option (google.api.http) = { get: "/snapshots" };
  }
  rpc GetSnapshotFile(GetSnapshotFileRequest) returns (SnapshotFileResponse) {
    option (google.api.http) = { get: "/snapshots/{id}/file/{file_id}" };
  }
}
