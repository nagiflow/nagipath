syntax = "proto3";

package nagipath.api.v1;

import "google/api/annotations.proto";
import "nagipath/api/v1/common.proto";
import "nagipath/api/v1/nodes.proto";

option go_package = "github.com/nagiflow/nagipath/internal/api/pb;pb";

message DriftBaselineOption {
  string kind = 1;
  string label = 2;
}

message DriftInstanceRow {
  int64 id = 1;
  string display_name = 2;
  string node_display_name = 3;
  int32 divergence_count = 4;
  string object_breakdown = 5;
  string first_seen = 6;
}

message DriftClusterGroup {
  string cluster_name = 1;
  string baseline_name = 2;
  int32 nodes_with_drift = 3;
  int32 total_nodes = 4;
  repeated DriftInstanceRow instances = 5;
  // 0 for the "No cluster" group. Lets the group band offer "Set baseline"
  // without a second round trip to resolve a name back to an id.
  int64 cluster_id = 6;
}

message DriftClusterOption {
  int64 id = 1;
  string name = 2;
  int32 members = 3;
}

message IgnoreRule {
  int64 id = 1;
  int64 cluster_id = 2;
  string object_kind = 3;
  string field = 4;
  string pattern = 5;
  string reason = 6;
  string created_at = 7;
  int32 matched = 8;
}

message DriftResponse {
  repeated DriftClusterOption clusters = 1;
  int64 cluster_id = 2;
  string cluster_name = 3;
  string baseline = 4;
  repeated DriftBaselineOption baselines = 5;
  bool all_scope = 6;
  string scope = 7;
  string scope_filter = 8;
  repeated IgnoreRule ignores = 9;
  repeated DriftInstanceRow instances_with_drift = 10;
  repeated DriftClusterGroup cluster_groups = 11;
  repeated DriftRun runs = 12;
  int32 total_divergent_objects = 13;
  int32 clusters_without_baseline = 14;
  int32 member_count = 15;
  bool empty = 16;
}

message DriftObjectGroup {
  string kind = 1;
  repeated DriftFinding findings = 2;
}

message DriftReviewResponse {
  int64 instance_id = 1;
  string instance_display_name = 2;
  string node_display_name = 3;
  int64 node_id = 4;
  int32 object_count = 5;
  string baseline_label = 6;
  string subject_time = 7;
  string baseline_time = 8;
  repeated DriftObjectGroup object_groups = 9;
  int64 next_instance_id = 10;
  // The review page's "Ignore this object" scopes an IgnoreRule to the
  // instance's cluster, so it has to know which one that is.
  int64 cluster_id = 11;
  int32 ignored_count = 12;
}

message GetDriftRequest {
  string scope = 1;
  string baseline = 2;
  string cluster = 3;
}

message GetDriftReviewRequest {
  int64 instance_id = 1;
}

message RecomputeDriftRequest {
  string cluster = 1;
  string baseline = 2;
}

message RecomputeDriftResponse {
  bool ok = 1;
  int32 compared = 2;
  repeated string skipped = 3;
}

message IgnoreDriftRequest {
  int64 cluster = 1;
  string object_kind = 2;
  string field = 3;
  string pattern = 4;
  string reason = 5;
}

message UnignoreDriftRequest {
  int64 id = 1;
}

message SetGoldenPeerRequest {
  int64 cluster = 1;
  int64 instance = 2;
}

// DriftService: GET /drift, GET /drift/review/{instance_id},
// POST /drift/recompute, POST /drift/ignore, POST /drift/ignore/{id}/delete
// and POST /drift/golden (internal/api/driftservice.go).
service DriftService {
  rpc GetDrift(GetDriftRequest) returns (DriftResponse) {
    option (google.api.http) = { get: "/drift" };
  }
  rpc GetDriftReview(GetDriftReviewRequest) returns (DriftReviewResponse) {
    option (google.api.http) = { get: "/drift/review/{instance_id}" };
  }
  rpc RecomputeDrift(RecomputeDriftRequest) returns (RecomputeDriftResponse) {
    option (google.api.http) = { post: "/drift/recompute", body: "*" };
  }
  rpc IgnoreDrift(IgnoreDriftRequest) returns (Ok) {
    option (google.api.http) = { post: "/drift/ignore", body: "*" };
  }
  rpc UnignoreDrift(UnignoreDriftRequest) returns (Ok) {
    option (google.api.http) = { post: "/drift/ignore/{id}/delete" };
  }
  rpc SetGoldenPeer(SetGoldenPeerRequest) returns (Ok) {
    option (google.api.http) = { post: "/drift/golden", body: "*" };
  }
}
