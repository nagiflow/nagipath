syntax = "proto3";

package nagipath.api.v1;

import "google/api/annotations.proto";
import "nagipath/api/v1/common.proto";

option go_package = "github.com/nagiflow/nagipath/internal/api/pb;pb";

message NodeListRow {
  int64 id = 1;
  string address = 2;
  int32 ssh_port = 3;
  string display_name = 4;
  string os_family = 5;
  bool enabled = 6;
  int32 consecutive_failures = 7;
  int32 instance_count = 8;
  int32 pending_host_keys = 9;
  string last_collection = 10;
  string last_status = 11;
  string vendor = 12;
  string version = 13;
  string cluster = 14;
  int32 process_count = 15;
  string listeners = 16;
  string last_captured = 17;
}

message NodesListResponse {
  repeated NodeListRow nodes = 1;
  string query = 2;
  int32 total = 3;
  int32 threshold = 4;
  int32 pending = 5;
  int32 quarantined = 6;
  int32 never_collected = 7;
}

message Node {
  int64 id = 1;
  string address = 2;
  int32 ssh_port = 3;
  string display_name = 4;
  string ssh_username = 5;
  int64 credential_id = 6;
  string os_family = 7;
  bool sudo_available = 8;
  bool enabled = 9;
  string source = 10;
  string notes = 11;
  int32 consecutive_failures = 12;
  string first_seen_at = 13;
  string last_collection = 14;
  string last_status = 15;
  // 0 means a direct connection; set means every dial to this node tunnels
  // through the referenced node's own SSH connection instead (sshx.go's
  // bastion chain, capped at 4 hops).
  int64 bastion_node_id = 16;
}

message Credential {
  int64 id = 1;
  string name = 2;
  string username = 3;
  string auth_kind = 4;
  string public_key = 5;
  string fingerprint = 6;
  string external_ref = 7;
  string created_at = 8;
}

message Instance {
  int64 id = 1;
  int64 node_id = 2;
  int64 cluster_id = 3;
  string vendor = 4;
  string display_name = 5;
  string version = 6;
  string main_config_path = 7;
  string node_display_name = 8;
  int32 site_count = 9;
  int32 route_count = 10;
  int32 cert_count = 11;
  string last_captured = 12;
  string cluster_name = 13;
  bool degraded = 14;
  string parse_state = 15;
  string state = 16;
  // The restart line for this Instance, already resolved: the operator's
  // stored override if there is one, otherwise the derived default
  // (`systemctl restart <unit>`), otherwise empty — which means nagipath
  // cannot guess and the operator has to supply one.
  string restart_command = 17;
}

message HostKey {
  int64 id = 1;
  int64 node_id = 2;
  string algorithm = 3;
  string fingerprint = 4;
  string state = 5;
  string first_seen_at = 6;
  string decided_at = 7;
}

message PendingHostKey {
  HostKey key = 1;
  string node_name = 2;
  string node_address = 3;
  string previous = 4;
  // Every cluster this node's processes sit in, comma-separated. A node has no
  // cluster of its own, so this is a list, not a single name.
  string cluster = 5;
}

message NodeStats {
  int32 sites = 1;
  int32 routes = 2;
  int32 upstreams = 3;
  int32 cert_count = 4;
  int32 drift_count = 5;
}

message UpstreamPool {
  int64 id = 1;
  string name = 2;
  string kind = 3;
  string balance_method = 4;
  int32 member_count = 5;
  string used_by = 6;
  string resolution = 7;
  string state = 8;
}

message UpstreamMember {
  string host = 1;
  int32 port = 2;
  int32 weight = 3;
  string flags = 4;
  string role = 5;
  string node_name = 6;
}

message NodeCertBinding {
  string subject_cn = 1;
  string site_name = 2;
  int32 port = 3;
  string not_after = 4;
  string fingerprint = 5;
  string key_type = 6;
  int32 chain_length = 7;
}

message FileRef {
  int64 id = 1;
  string kind = 2;
  string path = 3;
  int64 bytes_raw = 4;
  bool truncated = 5;
}

message Snapshot {
  int64 id = 1;
  string captured_at = 2;
  bool degraded = 3;
  string degraded_reason = 4;
  int32 file_count = 5;
  int64 bytes_raw = 6;
  string parse_state = 7;
}

message DriftRun {
  int64 id = 1;
  int64 instance_id = 2;
  string baseline_kind = 3;
  string baseline_label = 4;
  string computed_at = 5;
  int32 finding_count = 6;
  // The rest are unused by the node detail drift tab, populated for the
  // fleet-wide Drift screen's "what was compared" panel (drift.proto).
  string instance_name = 7;
  string node_name = 8;
  string vendor = 9;
  int32 parser_version = 10;
  int32 ignored_count = 11;
  bool is_golden_peer = 12;
}

// Provenance is the file and byte offset a derived fact was parsed from —
// the product's trust mechanism (internal/web/templates/parts/prov.html),
// present on rules, routes, sites, listeners, upstreams, certificate
// bindings and drift findings without exception. link is precomputed here
// (empty when there's no file recorded — parsed before provenance was
// tracked) rather than built client-side from the raw ids, matching this
// package's "no business logic recomputed in TypeScript" rule (ADR-0018).
message Provenance {
  string path = 1;
  int64 snapshot_id = 2;
  int64 file_id = 3;
  int64 byte_start = 4;
  string link = 5;
}

message DriftFinding {
  int64 id = 1;
  string object_kind = 2;
  string natural_key = 3;
  string change = 4;
  string field = 5;
  string baseline_text = 6;
  string subject_text = 7;
  string action_class = 8;
  Provenance provenance = 9;
}

// Route mirrors internal/trace.Route: one match rule inside a site, possibly
// with children (nested location blocks). Recursive on purpose — the
// frontend renders the same tree structure the config actually has.
message Route {
  int64 id = 1;
  string match_type = 2;
  string pattern = 3;
  int32 ordinal = 4;
  bool is_terminal = 5;
  int64 upstream_id = 6;
  string target_raw = 7;
  repeated Route children = 8;
}

message Site {
  int64 id = 1;
  string primary_name = 2;
  string kind = 3;
  repeated string names = 4;
  repeated Route routes = 5;
}

message UpstreamMemberRef {
  int64 id = 1;
  string host = 2;
  int32 port = 3;
  string scheme = 4;
  string flags = 5;
}

message Upstream {
  int64 id = 1;
  string name = 2;
  string kind = 3;
  string balance_method = 4;
  repeated UpstreamMemberRef members = 5;
}

// Inst mirrors internal/trace.Inst — the parsed instance graph the Sites and
// Routes tabs render from. Global rules and raw listeners aren't included;
// neither tab uses them yet.
message Inst {
  int64 id = 1;
  string node_name = 2;
  string vendor = 3;
  string display_name = 4;
  string cluster_name = 5;
  bool degraded = 6;
  repeated Site sites = 7;
  repeated Upstream upstreams = 8;
}

message NodeTabItem {
  string label = 1;
  string href = 2;
  int32 count = 3;
  bool on = 4;
}

message RouteEffect {
  string upstream_name = 1;
  int32 member_count = 2;
  string balance_method = 3;
  repeated UpstreamMemberRef members = 4;
}

message NodeDetailResponse {
  Node node = 1;
  repeated Credential credentials = 2;
  repeated Instance instances = 3;
  Instance selected = 4;
  repeated HostKey host_keys = 5;
  repeated PendingHostKey pending_keys = 6;
  NodeStats stats = 7;
  bool running = 8;
  int32 threshold = 9;
  repeated NodeTabItem tabs = 10;
  string tab = 11;
  string credential_name = 12;

  Inst inst = 13;
  repeated UpstreamPool upstreams = 14;
  UpstreamPool selected_pool = 15;
  repeated UpstreamMember pool_members = 16;
  repeated NodeCertBinding certificates = 17;
  repeated FileRef files = 18;
  Snapshot snapshot = 19;
  FileRef selected_file = 20;
  string file_body = 21;
  int32 byte_start = 22;
  int32 line_start = 23;

  repeated DriftRun drift_runs = 24;
  repeated DriftFinding drift_findings = 25;
  map<string, int32> drift_by_object = 26;
  bool has_drift = 27;
  string no_drift_reason = 28;

  string selected_site_name = 29;
  Route selected_route = 30;
  RouteEffect route_effect = 31;

  // Display name of node.bastion_node_id's target, resolved the same way
  // credential_name is — empty when the node connects directly.
  string bastion_name = 32;
}

// ImportedNode is one row of what Import inventory actually added — enough
// to link to the new node and offer a "Collect now" button without a
// second round trip.
message ImportedNode {
  int64 id = 1;
  string display_name = 2;
  string address = 3;
  int32 ssh_port = 4;
}

message ImportNodesResponse {
  repeated ImportedNode added = 1;
  // refused is one line per host the parser or AddNode rejected, human
  // readable ("10.90.4.0/24: nagipath does not scan networks; add one host
  // at a time") — the same messages the pre-SPA flash banner showed.
  repeated string refused = 2;
}

message ListNodesRequest {
  string q = 1;
}

message AddNodeRequest {
  string address = 1;
  int32 port = 2;
  string display_name = 3;
  string username = 4;
  int64 credential_id = 5;
  // Optional: an already-registered node to tunnel this connection through.
  int64 bastion_node_id = 6;
}

message ImportNodesRequest {
  string inventory = 1;
  int64 credential_id = 2;
  // Optional: applied to every host in this batch, same as credential_id.
  int64 bastion_node_id = 3;
}

// GetNodeRequest covers every tab's query params in one flat message — the
// same way the pre-gateway handler read all of them off one *http.Request
// regardless of which tab ended up using them (nodes.go's getNode).
message GetNodeRequest {
  int64 id = 1;
  string tab = 2;
  int64 process = 3;
  int64 pool = 4;
  string site = 5;
  string route = 6;
  int64 file = 7;
  string b = 8;
}

message NodeIdRequest {
  int64 id = 1;
}

message ChangeNodeCredentialRequest {
  int64 id = 1;
  int64 credential_id = 2;
}

message ChangeNodeBastionRequest {
  int64 id = 1;
  // 0 clears it back to a direct connection.
  int64 bastion_node_id = 2;
}

message DecideHostKeyRequest {
  int64 id = 1;
  string decision = 2;
}

message DecideHostKeyResponse {
  bool ok = 1;
  bool approved = 2;
}

// TestConnectionResponse is one attempt to reach an already-added node over
// SSH — the same dial and Check() the collector opens with, without running a
// collection. Used by Import inventory's step 2 (test connections and host
// keys) and by a "Retry" on any node stuck FAILED, so both share one result
// shape. A brand-new node has no approved key on file yet, so its first test
// always comes back host_key_pending — approving it (DecideHostKey) is what
// lets a retest reach connected.
message TestConnectionResponse {
  // "connected" | "host_key_pending" | "failed"
  string status = 1;
  int32 latency_ms = 2;
  // Set when status == "failed".
  string error = 3;
  // Set when status == "connected".
  string os_family = 4;
  // Set when status == "host_key_pending": the key blocking this attempt,
  // already recorded pending by the same CheckHostKey path Settings / Host
  // keys reads — approving it there (or retesting) needs no separate call.
  HostKey pending_key = 5;
  // The previously-approved fingerprint for pending_key's algorithm, if any —
  // empty for a node seeing its first key ever, set when this is a rekey.
  string previous_fingerprint = 6;
}

// GetNodeFileRequest reads a config file as it is on the Node right now, not
// as a Snapshot captured it — an edit has to start from the live bytes or it
// silently reverts whatever changed since the last Collection.
message GetNodeFileRequest {
  int64 node_id = 1;
  string path = 2;
}

message NodeFileResponse {
  string path = 1;
  string body = 2;
  // The file was longer than the edit cap and is NOT safe to write back.
  bool truncated = 3;
}

message WriteNodeFileRequest {
  int64 node_id = 1;
  string path = 2;
  string body = 3;
}

message WriteNodeFileResponse {
  bool ok = 1;
  // Where the previous content was copied to on the Node. Empty when the file
  // did not exist before this write.
  string backup_path = 2;
}

// RestartInstanceRequest carries the command the operator saw and approved.
// Empty means "use whatever Instance.restart_command resolved to"; anything
// else is stored as that Instance's override and reused next time.
message RestartInstanceRequest {
  int64 instance_id = 1;
  string command = 2;
}

message RestartInstanceResponse {
  bool ok = 1;
  string command = 2;
  string stdout = 3;
  string stderr = 4;
  int32 exit_code = 5;
}

// NodeService: every /nodes and /hostkeys route (internal/api/nodes.go).
// requireAuth wraps the whole gateway; every RPC but ListNodes and GetNode
// calls requireAdminRPC as its own first line — same reasoning as
// DriftService's mutations (drift.proto).
service NodeService {
  rpc ListNodes(ListNodesRequest) returns (NodesListResponse) {
    option (google.api.http) = { get: "/nodes" };
  }
  rpc AddNode(AddNodeRequest) returns (IdResponse) {
    option (google.api.http) = { post: "/nodes", body: "*" };
  }
  rpc ImportNodes(ImportNodesRequest) returns (ImportNodesResponse) {
    option (google.api.http) = { post: "/nodes/import", body: "*" };
  }
  // Declared before GetNode on purpose: grpc-gateway matches patterns in
  // registration order, and GetNode's `/nodes/{id}/{tab}` would otherwise
  // swallow every `/nodes/{node_id}/livefile` as a tab named "livefile".
  rpc GetNodeFile(GetNodeFileRequest) returns (NodeFileResponse) {
    option (google.api.http) = { get: "/nodes/{node_id}/livefile" };
  }
  rpc WriteNodeFile(WriteNodeFileRequest) returns (WriteNodeFileResponse) {
    option (google.api.http) = { post: "/nodes/{node_id}/livefile", body: "*" };
  }
  rpc RestartInstance(RestartInstanceRequest) returns (RestartInstanceResponse) {
    option (google.api.http) = { post: "/instances/{instance_id}/restart", body: "*" };
  }
  rpc GetNode(GetNodeRequest) returns (NodeDetailResponse) {
    option (google.api.http) = {
      get: "/nodes/{id}/{tab}"
      additional_bindings { get: "/nodes/{id}" }
    };
  }
  rpc CollectNode(NodeIdRequest) returns (Ok) {
    option (google.api.http) = { post: "/nodes/{id}/collect" };
  }
  rpc DeleteNode(NodeIdRequest) returns (Ok) {
    option (google.api.http) = { post: "/nodes/{id}/delete" };
  }
  rpc ChangeNodeCredential(ChangeNodeCredentialRequest) returns (Ok) {
    option (google.api.http) = { post: "/nodes/{id}/credential", body: "*" };
  }
  rpc ChangeNodeBastion(ChangeNodeBastionRequest) returns (Ok) {
    option (google.api.http) = { post: "/nodes/{id}/bastion", body: "*" };
  }
  rpc DecideHostKey(DecideHostKeyRequest) returns (DecideHostKeyResponse) {
    option (google.api.http) = { post: "/hostkeys/{id}/decide", body: "*" };
  }
  rpc TestNodeConnection(NodeIdRequest) returns (TestConnectionResponse) {
    option (google.api.http) = { post: "/nodes/{id}/test" };
  }
}
