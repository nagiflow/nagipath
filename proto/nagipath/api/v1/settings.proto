syntax = "proto3";

package nagipath.api.v1;

import "google/api/annotations.proto";
import "nagipath/api/v1/common.proto";
import "nagipath/api/v1/nodes.proto";

option go_package = "github.com/nagiflow/nagipath/internal/api/pb;pb";

// ---------------------------------------------------------------- credentials

message CredentialItem {
  int64 id = 1;
  string name = 2;
  string username = 3;
  string auth_kind = 4;
  string public_key = 5;
  string fingerprint = 6;
  string external_ref = 7;
  string created_at = 8;
  int32 node_count = 9;
  string last_used = 10;
}

message CredentialsResponse {
  repeated CredentialItem credentials = 1;
  repeated string auth_kinds = 2;
}

// ---------------------------------------------------------------- host keys

message HostKeyStatsPB {
  int32 pending = 1;
  int32 changed = 2;
  int32 approved = 3;
  map<string, int32> algorithms = 4;
}

message HostKeysResponse {
  HostKeyStatsPB stats = 1;
  repeated PendingHostKey keys = 2;
  // Cluster names for the Cluster filter, which has to list clusters the
  // current filter has already excluded.
  repeated string clusters = 3;
  // Off by default: an unrecognized key still blocks the connection pending
  // manual approval. On, a node's first-ever key (never one that replaces an
  // already-approved key — that is always a mismatch, decided manually
  // regardless of this setting) is auto-approved instead.
  bool tofu_enabled = 4;
}

// ---------------------------------------------------------------- master key

message MasterKeyResponse {
  string path = 1;
  string data_dir = 2;
  int32 credentials_encrypted = 3;
  int32 api_keys_encrypted = 4;
  int32 job_logs_encrypted = 5;
}

// ---------------------------------------------------------------- retention

message PruneCountsPB {
  int32 snapshots = 1;
  int32 job_logs = 2;
  int32 traces = 3;
  int32 audit_events = 4;
}

// PrunedCountsPB mirrors store.Pruned, the shape of an actual prune run's
// deletions — a different field set than PruneCountsPB (which mirrors
// store.PruneExamined/PruneKept): a prune deletes probes and blobs, not
// "traces".
message PrunedCountsPB {
  int64 snapshots = 1;
  int64 job_logs = 2;
  int64 probes = 3;
  int64 audit_events = 4;
  int64 blobs = 5;
}

message PruneHistoryPB {
  string ran_at = 1;
  double duration_seconds = 2;
  PruneCountsPB examined = 3;
  PrunedCountsPB deleted = 4;
  PruneCountsPB kept = 5;
  int64 freed_bytes = 6;
}

message RetentionStatsPB {
  int64 index_size_bytes = 1;
  int32 snapshots = 2;
  int32 job_logs = 3;
  int32 traces = 4;
  PruneHistoryPB last_prune = 5;
}

message RetentionResponse {
  int32 snapshot_days = 1;
  int32 min_per_instance = 2;
  int32 job_log_days = 3;
  int32 probe_days = 4;
  int32 audit_days = 5;
  RetentionStatsPB stats = 6;
}

// ---------------------------------------------------------------- collection defaults

message CollectionDefaultsResponse {
  repeated CredentialItem credentials = 1;
  int64 default_credential = 2;
  int32 interval_minutes = 3;
  int32 jitter_seconds = 4;
  int32 ssh_workers = 5;
  int32 command_timeout = 6;
  int32 max_files = 7;
  int32 probe_redirects = 8;
  int32 probe_lookback = 9;
}

// ---------------------------------------------------------------- users

message UserItem {
  int64 id = 1;
  string username = 2;
  string role = 3;
  string display_name = 4;
  bool must_change_password = 5;
  string created_at = 6;
  string last_login_at = 7;
  bool disabled = 8;
}

message UsersResponse {
  repeated UserItem users = 1;
}

// ---------------------------------------------------------------- audit

message AuditEventItem {
  string at = 1;
  string actor_label = 2;
  string action = 3;
  string target_kind = 4;
  string target_label = 5;
  string outcome = 6;
  string detail = 7;
  string source_ip = 8;
}

message AuditResponse {
  repeated AuditEventItem events = 1;
  int32 total = 2;
  int32 total_pages = 3;
  int32 page = 4;
  int32 per_page = 5;
  repeated string actions = 6;
}

// ---------------------------------------------------------------- api keys

message ApiKeyItem {
  int64 id = 1;
  string name = 2;
  string username = 3;
  string created_at = 4;
  string last_used_at = 5;
  string expires_at = 6;
  string revoked_at = 7;
  string prefix = 8;
}

message ApiKeysResponse {
  repeated ApiKeyItem keys = 1;
}

// ---------------------------------------------------------------- license

message LicenseStatePB {
  string customer = 1;
  string edition = 2;
  int32 node_ceiling = 3;
  string expires_at = 4;
  bool signature_valid = 5;
  string last_evaluated_at = 6;
  string installed_by_username = 7;
}

message LicenseResponse {
  bool loaded = 1;
  string customer = 2;
  string edition = 3;
  int32 node_ceiling = 4;
  string expiry = 5;
  string status = 6;
  string message = 7;
  int32 node_count = 8;
  LicenseStatePB state = 9;
}

// ---------------------------------------------------------------- system / diagnostics

message DiagnosticsResponse {
  string version = 1;
  string go_version = 2;
  int64 uptime_seconds = 3;
  string db_path = 4;
  int64 db_size_bytes = 5;
  string master_key_path = 6;
  bool master_key_present = 7;
  string master_key_mode = 8;
  string listen_addr = 9;
  bool tls_enabled = 10;
  bool demo_mode = 11;
  string license_status = 12;
  string license_message = 13;
  int32 migrations_applied = 14;
  int32 migrations_expected = 15;
}

// ---------------------------------------------------------------- collection jobs

message CollectionRow {
  int64 id = 1;
  int64 node_id = 2;
  string node_name = 3;
  string trigger = 4;
  string started_at = 5;
  string status = 6;
  string error = 7;
  int32 instances_seen = 8;
  int64 duration_ms = 9;
  string outcome = 10;
}

message CollectionsResponse {
  repeated CollectionRow rows = 1;
  int32 total = 2;
  int32 succeeded = 3;
  int32 degraded = 4;
  int32 failed = 5;
  int32 running = 6;
  int64 median_ms = 7;
  int64 p95_ms = 8;
  string next_cursor = 9;
  bool has_more = 10;
  int32 from = 11;
  int32 to = 12;
  bool empty = 13;
}

message ListCollectionsRequest {
  string node = 1;
  string status = 2;
  string trigger = 3;
  string range = 4;
  string cursor = 5;
}

// CollectionService: GET /collections. GET /collections?export=csv stays
// outside this service (api.go) — see SiteService's doc comment in
// sites.proto.
service CollectionService {
  rpc ListCollections(ListCollectionsRequest) returns (CollectionsResponse) {
    option (google.api.http) = { get: "/collections" };
  }
}

// -------------------------------------------------------- SettingsService requests

message GetCredentialsRequest {
  string type = 1;
}

message AddCredentialRequest {
  string name = 1;
  string auth_kind = 2;
  string username = 3;
  string private_key = 4;
  string passphrase = 5;
  string certificate = 6;
  string password = 7;
  string external_ref = 8;
}

message GetHostKeysRequest {
  string state = 1;
  string cluster = 2;
}

message SetHostKeyPolicyRequest {
  bool tofu_enabled = 1;
}

message SetRetentionRequest {
  optional int32 snapshot_days = 1;
  optional int32 min_per_instance = 2;
  optional int32 job_log_days = 3;
  optional int32 probe_days = 4;
  optional int32 audit_days = 5;
}

message RunRetentionResponse {
  bool ok = 1;
  int64 snapshots = 2;
  int64 job_logs = 3;
  int64 probes = 4;
  int64 audit_events = 5;
  int64 blobs = 6;
}

message SetCollectionDefaultsRequest {
  optional int32 interval_minutes = 1;
  optional int32 jitter_seconds = 2;
  optional int32 ssh_workers = 3;
  optional int32 command_timeout = 4;
  optional int32 max_files = 5;
  optional int32 probe_redirects = 6;
  optional int32 probe_lookback = 7;
  optional int64 default_credential = 8;
}

message AddUserRequest {
  string username = 1;
  string password = 2;
  string confirm = 3;
  string role = 4;
  bool must_change = 5;
}

message UserIdRequest {
  int64 id = 1;
}

message SetUserDisabledResponse {
  bool ok = 1;
  string status = 2;
}

message GetAuditRequest {
  string actor = 1;
  string action = 2;
  string range = 3;
  int32 page = 4;
  int32 per_page = 5;
}

message GetApiKeysRequest {
  string state = 1;
}

message CreateApiKeyRequest {
  string name = 1;
  int32 expires_days = 2;
}

message CreateApiKeyResponse {
  bool ok = 1;
  int64 id = 2;
  string token = 3;
}

message ApiKeyIdRequest {
  int64 id = 1;
}

message InstallLicenseRequest {
  string license_text = 1;
}

// SettingsService: every GET /settings/* and its mutations
// (internal/api/settingsservice.go). requireAuth wraps the whole gateway;
// every RPC but GetAudit and GetLicense additionally calls requireAdminRPC
// as its own first line — same reasoning as DriftService's mutations
// (drift.proto). GET /settings/audit?export=csv stays outside this service
// (api.go) — see SiteService's doc comment in sites.proto.
service SettingsService {
  rpc GetCredentials(GetCredentialsRequest) returns (CredentialsResponse) {
    option (google.api.http) = { get: "/settings/credentials" };
  }
  rpc AddCredential(AddCredentialRequest) returns (IdResponse) {
    option (google.api.http) = { post: "/settings/credentials", body: "*" };
  }
  rpc GetHostKeys(GetHostKeysRequest) returns (HostKeysResponse) {
    option (google.api.http) = { get: "/settings/hostkeys" };
  }
  rpc SetHostKeyPolicy(SetHostKeyPolicyRequest) returns (Ok) {
    option (google.api.http) = { post: "/settings/hostkeys/policy", body: "*" };
  }
  rpc GetMasterKey(Empty) returns (MasterKeyResponse) {
    option (google.api.http) = { get: "/settings/masterkey" };
  }
  rpc GetCollectionDefaults(Empty) returns (CollectionDefaultsResponse) {
    option (google.api.http) = { get: "/settings/collection-defaults" };
  }
  rpc SetCollectionDefaults(SetCollectionDefaultsRequest) returns (Ok) {
    option (google.api.http) = { post: "/settings/collection-defaults", body: "*" };
  }
  rpc GetRetention(Empty) returns (RetentionResponse) {
    option (google.api.http) = { get: "/settings/retention" };
  }
  rpc SetRetention(SetRetentionRequest) returns (Ok) {
    option (google.api.http) = { post: "/settings/retention", body: "*" };
  }
  rpc RunRetention(Empty) returns (RunRetentionResponse) {
    option (google.api.http) = { post: "/settings/retention/prune", body: "*" };
  }
  rpc GetUsers(Empty) returns (UsersResponse) {
    option (google.api.http) = { get: "/settings/users" };
  }
  rpc AddUser(AddUserRequest) returns (IdResponse) {
    option (google.api.http) = { post: "/settings/users", body: "*" };
  }
  rpc DisableUser(UserIdRequest) returns (SetUserDisabledResponse) {
    option (google.api.http) = { post: "/settings/users/{id}/disable" };
  }
  rpc EnableUser(UserIdRequest) returns (SetUserDisabledResponse) {
    option (google.api.http) = { post: "/settings/users/{id}/enable" };
  }
  rpc GetAudit(GetAuditRequest) returns (AuditResponse) {
    option (google.api.http) = { get: "/settings/audit" };
  }
  rpc GetApiKeys(GetApiKeysRequest) returns (ApiKeysResponse) {
    option (google.api.http) = { get: "/settings/api-keys" };
  }
  rpc CreateApiKey(CreateApiKeyRequest) returns (CreateApiKeyResponse) {
    option (google.api.http) = { post: "/settings/api-keys", body: "*" };
  }
  rpc RevokeApiKey(ApiKeyIdRequest) returns (Ok) {
    option (google.api.http) = { post: "/settings/api-keys/{id}/revoke" };
  }
  rpc GetLicense(Empty) returns (LicenseResponse) {
    option (google.api.http) = { get: "/settings/license" };
  }
  rpc InstallLicense(InstallLicenseRequest) returns (Ok) {
    option (google.api.http) = { post: "/settings/license", body: "*" };
  }
  rpc GetDiagnostics(Empty) returns (DiagnosticsResponse) {
    option (google.api.http) = { get: "/settings/system" };
  }
}
