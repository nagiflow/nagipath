syntax = "proto3";

package nagipath.api.v1;

option go_package = "github.com/nagiflow/nagipath/internal/api/pb;pb";

message ProbeRecordPB {
  int64 probe_id = 1;
  string token = 2;
  string method = 3;
  string url = 4;
  int32 status = 5;
  string result = 6;
  string error = 7;
  string actor_label = 8;
  string origin_host = 9;
  string requested_at = 10;
  int32 evidence = 11;
  int32 verified = 12;
  repeated string changes = 13;
  int32 raised = 14;
}

message ProbeEvidenceRowPB {
  int32 hop_ordinal = 1;
  string instance = 2;
  string node = 3;
  string kind = 4;
  string log_path = 5;
  string raw = 6;
  string grants = 7;
  string observed_at = 8;
  string prior = 9;
}

// HopChangePB is internal/probe.HopChange: one host this Probe moved off its
// prior confidence, or examined and could not move.
message HopChangePB {
  string host = 1;
  string prior = 2;
  string grants = 3;
  string kind = 4;
  string log_path = 5;
  // To is the confidence this Probe raised the host to, empty when it raised none.
  string to = 6;
}

// ProbePastPB is internal/probe.Past, the full stored result for the probe
// history detail panel — response, hop outcomes, evidence rows, and the
// state-change summary its own Changes()/LogReads() methods compute.
message ProbePastPB {
  int64 probe_id = 1;
  string token = 2;
  string method = 3;
  string url = 4;
  int32 status = 5;
  string status_text = 6;
  int64 duration_ms = 7;
  string error = 8;
  string requested_at = 9;
  string actor_label = 10;
  string origin_host = 11;
  string outcome = 12;
  repeated ProbeEvidenceRowPB evidence = 13;
  int32 redirect_count = 14;
  string log_reads = 15;
  repeated HopChangePB changes = 16;
  int32 change_count = 17;
}

message ProbeHistoryResponse {
  string url = 1;
  string query = 2;
  string range = 3;
  string actor = 4;
  string outcome = 5;
  repeated ProbeRecordPB probes = 6;
  repeated string actors = 7;
  ProbePastPB selected = 8;
  int32 total = 9;
  int32 actor_count = 10;
  int32 from = 11;
  int32 to = 12;
  bool has_more = 13;
  string next_cursor = 14;
}

message ProbeHopEvidencePB {
  int32 hop_ordinal = 1;
  string node_name = 2;
  string vendor = 3;
  string evidence = 4;
  string before = 5;
  string after = 6;
  bool has_gap = 7;
  string gap_vendor = 8;
  string gap_note = 9;
  string gap_directive = 10;
}

message ProbeLogLinePB {
  string node_name = 1;
  string log_path = 2;
  string raw_line = 3;
}

message ProbeViewPB {
  int64 probe_id = 1;
  int64 trace_id = 2;
  string actor_username = 3;
  string method = 4;
  string url = 5;
  int32 max_redirects = 6;
  string correlation_token = 7;
  string origin_host = 8;
  string requested_at = 9;
  int32 status = 10;
  int64 duration_ms = 11;
  int32 redirect_count = 12;
  string server_header = 13;
  string via_header = 14;
  string result = 15;
  int32 log_capable_count = 16;
  int32 verified_count = 17;
  int32 still_inferred = 18;
  int32 retention_days = 19;
}

message ProbeDetailResponse {
  ProbeViewPB probe = 1;
  repeated ProbeHopEvidencePB hops = 2;
  repeated ProbeLogLinePB log_lines = 3;
  repeated ProbeHopEvidencePB gaps = 4;
  int32 state_changes = 5;
}
