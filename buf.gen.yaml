version: v2
plugins:
  - local: protoc-gen-go
    out: internal/api/pb
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: internal/api/pb
    opt:
      - paths=source_relative
  - local: protoc-gen-grpc-gateway
    out: internal/api/pb
    opt:
      - paths=source_relative
      - generate_unbound_methods=false
  - local: ui/node_modules/.bin/protoc-gen-es
    out: ui/src/api/pb
    opt:
      - target=ts
