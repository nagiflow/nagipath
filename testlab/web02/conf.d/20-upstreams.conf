# Upstreams. Five pools with four different balancing strategies, because the
# strategy decides whether a Trace has one next hop or several.
#
# `round-robin` and `least_conn` mean any member can serve the request, so every
# member is a real destination and the Trace branches. `ip_hash` and `hash ...
# consistent` mean the member is a function of the request, so the branch is
# still unresolved — but for a different reason, and an inventory that reported
# "1 member" for a hashed pool of four would be wrong.

# The documented path: /api/ on this node proxies here, and app01 is the origin.
upstream app_backend {
    server app01:8080 max_fails=2 fail_timeout=10s;
    keepalive 32;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

# The canary pool. Selected by $api_pool from conf.d/00-maps.conf, so which of
# the two pools serves a request depends on a request header.
upstream app_canary {
    server app01:8080 weight=1 max_fails=1 fail_timeout=5s;
    server 10.90.4.7:8080 weight=1 backup;
    keepalive 8;
}

# Sticky by client address, and one member is down by administrative decision
# rather than by health check. `down` is configuration, not state — which makes
# it exactly the kind of thing that gets left in place for a year.
upstream session_backend {
    ip_hash;
    server app01:8080;
    server 10.90.4.7:8080 down;
}

# Consistent hashing on the request URI. Used by the static tier so the same
# object lands on the same member and the cache is not duplicated.
upstream asset_backend {
    hash $request_uri consistent;
    server app01:8080 max_fails=3 fail_timeout=30s;
    server 10.90.4.7:8080 max_fails=3 fail_timeout=30s;
}

# Fewest connections, and the member count is two even though only one answers.
# web05's copy of this file has the same name and different members, which is the
# drift that a per-node view cannot see and a fleet view can.
upstream auth_backend {
    least_conn;
    server app01:8080 max_fails=2 fail_timeout=10s;
    server 10.90.4.7:8080 max_fails=2 fail_timeout=10s;
    keepalive 16;
}

# A gRPC pool. Different protocol, same modelling problem: members, weights and a
# health posture that live in configuration.
upstream grpc_backend {
    server app01:8080;
    keepalive 8;
}

# FastCGI, which is a proxy hop that is not HTTP. A Trace has to end here and say
# what it ended in rather than pretending the request continued over HTTP.
upstream php_fcgi {
    server 127.0.0.1:9000;
}
