# Request-time variables. Every one of these is a decision nginx makes from the
# request, so nothing here can be resolved by reading configuration — which is
# the point of including it in the lab. A `proxy_pass` whose target is a variable
# is a route nagipath must report as undetermined, not follow.

# The websocket handshake. `map` is the idiomatic way to do this and it is why
# `proxy_set_header Connection $connection_upgrade` is safe on a non-websocket
# location: the variable is empty there.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# CORS allowlist. An origin not in this map yields an empty string, and the
# `add_header` below it therefore emits nothing — a header that is configured,
# valid, and absent from most responses.
map $http_origin $cors_origin {
    default                      '';
    'https://shop.example.com'   $http_origin;
    'https://admin.example.com'  $http_origin;
    '~^https://[a-z0-9-]+\.partner\.example\.com$' $http_origin;
}

# API version pinned by header, defaulting to the URI. This is the variable that
# selects an upstream in sites-enabled/shop.example.com.conf, and the reason that
# route cannot be followed from configuration alone.
map $http_x_api_channel $api_pool {
    default  app_backend;
    stable   app_backend;
    canary   app_canary;
}

# Cache bypass. A request with a cookie skips the cache, so the same URL is
# sometimes a hop to app01 and sometimes not.
map $http_cookie $skip_cache {
    default             0;
    '~*sessionid='      1;
}

map $request_method $is_write {
    default  1;
    GET      0;
    HEAD     0;
    OPTIONS  0;
}

# Trusted networks by source address. `geo` is evaluated per connection, which
# makes every `if ($internal_client)` below a branch on something no snapshot
# contains.
geo $internal_client {
    default        0;
    10.90.0.0/16   1;
    127.0.0.0/8    1;
    192.168.0.0/16 1;
}

# The real client address when there is a proxy in front. lb01 sets
# X-Forwarded-For, and getting this wrong makes every access-control rule below
# apply to the load balancer instead of to the client.
real_ip_header X-Forwarded-For;
set_real_ip_from 10.90.4.10;
real_ip_recursive on;
