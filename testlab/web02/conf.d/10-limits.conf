# Shared zones and caches. These are http-scope declarations with no effect on
# their own — the `limit_req` and `proxy_cache` directives that use them are in
# sites-enabled/, in a different file, and a zone declared here but used nowhere
# is a common piece of dead configuration that only an inventory finds.

limit_req_zone  $binary_remote_addr  zone=per_ip:10m    rate=30r/s;
limit_req_zone  $binary_remote_addr  zone=api_write:10m rate=5r/s;
limit_req_zone  $server_name         zone=per_site:10m  rate=500r/s;

# Declared and never used. It is here on purpose.
limit_req_zone  $http_authorization  zone=per_token:10m rate=100r/s;

limit_conn_zone $binary_remote_addr  zone=conn_per_ip:10m;

limit_req_status  429;
limit_conn_status 429;

# The response cache. `keys_zone` names it; `proxy_cache api_cache` in
# sites-enabled/ turns it on. A cached response never reaches app01, so a Trace
# that ignored this would claim a hop that did not happen.
proxy_cache_path /var/cache/nginx/api
                 levels=1:2
                 keys_zone=api_cache:20m
                 inactive=10m
                 max_size=512m
                 use_temp_path=off;

proxy_cache_path /var/cache/nginx/static
                 levels=1:2
                 keys_zone=static_cache:10m
                 inactive=7d
                 max_size=1g
                 use_temp_path=off;

proxy_cache_key      "$scheme$request_method$host$request_uri";
proxy_cache_lock     on;
proxy_cache_lock_timeout 5s;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_cache_background_update on;
proxy_cache_revalidate on;
