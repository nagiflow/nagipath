# The internal-only server. Two things here that a fleet inventory should notice
# and a per-node view will not:
#
#   1. A wildcard server_name. `*.internal.example.com` covers hostnames nobody
#      has written down, on a port nothing in front of this node exposes.
#   2. A regex server_name with a capture, which means the hostname the request
#      arrived on becomes a variable used in the configuration below. There is no
#      finite list of names this block serves.

server {
    listen 8090;
    server_name  web02.internal.example.com  *.internal.example.com  ~^(?<tenant>[a-z0-9-]+)\.tenants\.example\.com$;

    # Only reachable from inside. On a node whose :8090 is not published this is
    # belt and braces; on the day someone publishes it, it is the only control.
    allow 10.90.0.0/16;
    allow 127.0.0.0/8;
    deny  all;

    add_header X-Internal-Tier web02;

    location = /nginx_status {
        stub_status;
        access_log off;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    # The captured hostname selects the path on the origin. A route whose target
    # is derived from the request, on a server whose names are a regex — nothing
    # about where this request ends up is in this file.
    location /tenant/ {
        include /etc/nginx/snippets/proxy-defaults.conf;
        proxy_pass http://app_backend/tenants/$tenant/;
    }

    location / {
        return 404 "internal endpoints only\n";
    }
}
