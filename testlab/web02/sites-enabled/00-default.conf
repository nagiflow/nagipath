# The catch-all. Any request whose Host matches no other server block lands here,
# and 444 closes the connection without a response.
#
# It is first by filename so it is first in nginx's server list, which is what
# makes it the default for :8080 — but `default_server` is what actually decides
# that, and the two are confused often enough that both are spelled out here.
#
# For an inventory this is the server block that owns every hostname nobody
# declared. A hostname that resolves to this node and is not in any server_name
# is served by this block, which is worth being able to see.

server {
    listen 8080 default_server;
    server_name _;

    access_log /var/log/nginx/unmatched.log fleet_json;

    return 444;
}
