# shop.example.com on web02 — the origin-facing tier lb01's be_app points at.
#
# The location set below is a full nginx precedence matrix, in file order that
# deliberately disagrees with evaluation order. nginx evaluates: exact (=), then
# the longest matching prefix, then — unless that prefix was `^~` — every regex in
# file order, then falls back to the prefix it remembered. Reading this file top
# to bottom gives the wrong answer four times.

server {
    listen 8080;
    server_name shop.example.com;

    # Server-scope response headers. Both of these are discarded for any request
    # that reaches a location with its own `add_header` — which is most of them.
    # This is the product's single most valuable output and the reason these two
    # lines are here rather than in a snippet.
    add_header X-Frame-Options DENY;
    add_header X-Served-By web02;

    limit_conn conn_per_ip 40;
    limit_req  zone=per_site burst=200 nodelay;

    # A 502 from any upstream below is answered by @maintenance, so an unreachable
    # origin does not produce an unreachable page. It also means a Trace that ends
    # in a dead upstream still returns 200 to the client, and reporting the 200
    # without the dead upstream would hide the fault entirely.
    error_page 502 503 504 = @maintenance;
    error_page 404 /404.html;

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    # ^~ stops nginx evaluating regex locations at all for this prefix. It is a
    # short-circuit, not a higher score, and conflating the two is the usual way
    # to get nginx precedence wrong. The `~* \.(css|js|...)$` regex below would
    # otherwise win here, and does win for the same file served from anywhere else.
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~ \.php$ {
        return 404;
    }

    # Ranked above every prefix location except an exact match, so this wins for
    # /media/logo.png even though `location /media/` exists below and looks more
    # specific. Length does not enter into it.
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|woff2?)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Asset-Tier web02;
        access_log off;
    }

    location /api/ {
        # A nearer add_header discards *every* inherited one, so the two
        # server-level headers above do not reach a /api/ response. Reading the
        # file top to bottom suggests otherwise, which is exactly why nagipath
        # reports the discarded ones instead of the declared ones.
        add_header X-Api-Version 2;

        limit_req zone=per_ip burst=40 nodelay;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The trailing slash strips the matched /api/ prefix, so
        # /api/v2/charge arrives at app01 as /v2/charge.
        proxy_pass http://app_backend/;
    }

    # Same upstream pool, no trailing slash, so the prefix survives. Two locations
    # one line apart that differ by a single character and send app01 two
    # different paths for the same request.
    location /api-raw/ {
        add_header X-Api-Version 2;
        proxy_pass http://app_backend;
    }

    # Writes are rate limited harder and require the edge's bearer token to have
    # survived. `if` inside `location` is the directive nginx's own documentation
    # warns about, and it is here because real configurations are full of it.
    location /api/v2/admin/ {
        limit_req zone=api_write burst=5 nodelay;

        # `if` cannot contain `limit_req` — nginx rejects it outright, which is why
        # the rate limit is above rather than inside. What `if` *can* do is return,
        # and a `return` inside `if` is a Rule that terminates the request before
        # the `proxy_pass` three lines below it ever runs.
        if ($internal_client = 0) {
            return 403 "admin api is internal only\n";
        }
        include /etc/nginx/snippets/proxy-defaults.conf;
        proxy_pass http://app_backend/admin/;
    }

    # The upstream is a variable, resolved from a request header by the map in
    # conf.d/00-maps.conf. There is no way to know from this file whether a
    # request goes to app_backend or app_canary, so nagipath has to list both as
    # branches rather than follow one.
    location /api-channel/ {
        include /etc/nginx/snippets/proxy-defaults.conf;
        proxy_pass http://$api_pool/;
    }

    # A subrequest to auth_backend gates this location. The auth hop happens
    # before the proxy hop and against a different pool, so the request touches
    # two upstreams — one of which never appears in the response.
    location /account/ {
        auth_request     /_auth;
        auth_request_set $auth_user $upstream_http_x_auth_user;

        proxy_set_header X-Auth-User $auth_user;
        include /etc/nginx/snippets/proxy-defaults.conf;
        proxy_pass http://session_backend/account/;
    }

    # `internal` means this location is unreachable from outside. A route that
    # exists, proxies to a real pool, and cannot be requested.
    location = /_auth {
        internal;
        proxy_pass              http://auth_backend/verify;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        X-Original-URI $request_uri;
    }

    # Cached at this tier. A HIT never reaches app01, so the same URL is
    # sometimes a two-hop trace and sometimes a one-hop trace.
    location /catalog/ {
        proxy_cache            api_cache;
        proxy_cache_valid      200 301 5m;
        proxy_cache_valid      404 1m;
        proxy_cache_bypass     $skip_cache;
        proxy_no_cache         $skip_cache;
        add_header X-Cache-Status $upstream_cache_status;

        include /etc/nginx/snippets/proxy-defaults.conf;
        proxy_pass http://asset_backend/catalog/;
    }

    # gRPC. The hop is real and the protocol is not HTTP, which changes what can
    # be said about headers and what a Probe can verify.
    location /grpc/ {
        grpc_pass grpc://grpc_backend;
        grpc_set_header X-Request-ID $http_x_request_id;
        error_page 502 = /grpc-unavailable;
    }

    # FastCGI, to a socket that is not listening. A terminal hop of a kind that is
    # neither "static file" nor "HTTP proxy".
    location /legacy/ {
        fastcgi_pass  php_fcgi;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /srv/legacy$fastcgi_script_name;
        fastcgi_param QUERY_STRING    $query_string;
        fastcgi_read_timeout 60s;
    }

    # WebSocket. The Upgrade headers come from the snippet; without the map in
    # conf.d/00-maps.conf this would break every non-websocket location that
    # includes the same snippet.
    location /ws/ {
        include /etc/nginx/snippets/proxy-defaults.conf;
        proxy_pass http://session_backend/ws/;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # An internal-only redirect target. The origin returns X-Accel-Redirect and
    # nginx serves the file itself, so the response body never travels over the
    # proxy connection at all.
    location /protected-files/ {
        internal;
        alias /usr/share/nginx/html/;
        add_header X-Accel-Served web02;
    }

    # Basic auth *or* an internal address. `satisfy any` means either passes, and
    # reading the three lines in order suggests both are required.
    location /ops/ {
        satisfy any;
        allow 10.90.0.0/16;
        deny  all;
        auth_basic           "web02 ops";
        auth_basic_user_file /etc/nginx/htpasswd;

        alias /usr/share/nginx/html/;
        autoindex on;
    }

    # A path that moved. `last` re-enters location matching, so this request is
    # matched twice and the second match is the one that serves it — the Trace has
    # one hop on this node and two routes.
    location /old-api/ {
        rewrite ^/old-api/(.*)$ /api/$1 last;
    }

    # `permanent` leaves the fleet: the client is told to ask again. The Trace
    # ends here rather than continuing, and saying so is the whole answer.
    location /shop/ {
        return 301 https://$host/;
    }

    location /media/ {
        alias /usr/share/nginx/html/;
        # Rewrites the response body. Not modelled as a Config Object — it is kept
        # verbatim and searchable, and interpreting it would mean claiming to know
        # what the origin sends.
        sub_filter 'http://app01:8080' 'https://shop.example.com';
        sub_filter_once off;
        # text/html is always included and naming it again is a warning, not an
        # error — the kind of line that has been in a production config for years.
        sub_filter_types text/css application/json;
    }

    location @maintenance {
        root /usr/share/nginx/html;
        try_files /maintenance.html =503;
        add_header Retry-After 120;
    }

    location = /grpc-unavailable {
        return 503 "grpc backend unavailable\n";
    }

    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
