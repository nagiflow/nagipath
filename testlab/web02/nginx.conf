# web02 — the reference application tier. web05 is meant to be its twin and is
# not, which is the drift nagipath exists to surface.
#
# The layout is the one a real estate has: almost nothing in nginx.conf except
# tuning and three `include` lines, and the configuration that decides what
# happens to a request spread across conf.d/, snippets/ and sites-enabled/.
#
#   conf.d/       http-scope machinery — maps, zones, caches, upstreams
#   snippets/     fragments included from inside locations, by many sites
#   sites-enabled/  one file per Site
#
# This matters for provenance rather than for behaviour. `nginx -T` prints the
# whole tree as one stream; nagipath has to attribute every derived Rule back to
# the file and byte range it actually came from, and a snippet included from four
# places is four Rules from one line of text.

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;
pid        /var/run/nginx.pid;
error_log  /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # A structured access log. This is not decoration: nagipath verifies a Trace
    # against the vendor's own log, and it can only do that if the log carries the
    # fields to correlate on. A log_format without $host or the request id is why
    # a Hop stays Inferred instead of becoming Verified.
    log_format fleet_json escape=json
        '{"time":"$time_iso8601","host":"$host","server_name":"$server_name",'
        '"request":"$request","status":$status,"upstream":"$upstream_addr",'
        '"upstream_status":"$upstream_status","request_id":"$http_x_request_id",'
        '"probe":"$http_x_nagipath_probe",'
        '"cache":"$upstream_cache_status","rt":$request_time,"urt":"$upstream_response_time"}';

    access_log /var/log/nginx/access.log fleet_json;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    server_tokens off;
    client_max_body_size 16m;
    client_body_timeout 30s;
    server_names_hash_bucket_size 128;

    # TLS posture at http scope, inherited by every server block below. A site
    # that appears to have no TLS configuration of its own still has all of this.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain application/xml;

    proxy_http_version 1.1;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*.conf;
}
