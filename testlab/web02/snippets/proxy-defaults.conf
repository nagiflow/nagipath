# Included from inside several `location` blocks, on both web02 and web05.
#
# This is the fragment pattern, and it is the reason provenance has to be a byte
# range in a file rather than a line number in a rendered configuration. `nginx
# -T` prints these eight directives once per including location; nagipath has to
# report them as eight Rules per location that all point back to this one file,
# so an operator editing it can see everywhere it lands.

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Request-ID      $http_x_request_id;
proxy_set_header Connection        $connection_upgrade;
proxy_set_header Upgrade           $http_upgrade;

# The origin's own identity headers are stripped, so a response header naming
# app01 came from somewhere else. Worth knowing when reading a Probe's response.
proxy_hide_header X-Powered-By;
proxy_hide_header Server;
