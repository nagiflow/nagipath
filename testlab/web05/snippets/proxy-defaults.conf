# web05's copy of the shared proxy snippet, two changes behind web02's.
#
# Diff it against web02/snippets/proxy-defaults.conf. Missing here:
#
#   X-Forwarded-Host   added when the origin started generating absolute URLs
#   X-Request-ID       added when request tracing was introduced
#   proxy_hide_header  Server and X-Powered-By reach the client from this node
#
# A "shared" snippet that is a file on each host is not shared. Every location on
# this node that includes it forwards a different header set from the same
# location on web02, and the two nodes are behind one load balancer.

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection        $connection_upgrade;
proxy_set_header Upgrade           $http_upgrade;
