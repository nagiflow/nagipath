# web05 — nominally identical to web02, and identical only in the parts a health
# check looks at. It diverges in ways that are individually defensible and
# collectively a security incident:
#
#   1. X-Frame-Options is missing, so half the pool omits a security header.
#   2. There is an extra /debug/ route nobody remembers adding.
#   3. app_backend points at 10.90.4.7:8443, where nothing listens.
#   4. TLS floor is TLSv1 — the http-scope line web02 tightened and this node did not.
#   5. `server_tokens` is on, so the version is in every response.
#   6. Its snippets/proxy-defaults.conf is web02's from two changes ago, so every
#      location that includes it forwards a different header set.
#   7. auth_backend has one member here and two on web02, so a subrequest that is
#      load balanced there is pinned here.
#   8. client_max_body_size lives in a root-only include, so the value that is
#      actually in force cannot be read without the sudoers grant.
#
# None of these is visible from a load balancer. Several are invisible from this
# node too: 6 and 7 are only differences when something else is there to compare
# to, which is the entire argument for a fleet-wide inventory over per-host
# configuration management.
#
# It is also the only node without the sudoers grant, so its snapshot is degraded
# rather than complete and has to say which file it could not read.

user  nginx;
worker_processes  auto;
# web02 raised this and web05 was missed. Under load the two nodes fail
# differently, and the load balancer cannot tell.
worker_rlimit_nofile 1024;
pid        /var/run/nginx.pid;
error_log  /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # web02's log_format is JSON and carries $http_x_request_id. This one is the
    # stock combined format. It has no request id, so a Probe against this node
    # cannot be correlated to a log line — which means a Hop through web05 can
    # never be Verified, only Inferred. The drift is in the observability, and it
    # is the drift that makes the other drift harder to prove.
    log_format fleet_plain '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent "$http_referer"';

    access_log /var/log/nginx/access.log fleet_plain;

    sendfile      on;
    keepalive_timeout 65;

    # web02 sets this off. A version number in every response header, on the node
    # that is also the one running the unpatched TLS floor below.
    server_tokens on;

    # The root-only include. `client_max_body_size` is set inside it, so the value
    # in force on this node is not in any file a collection without the sudoers
    # grant can read. The snapshot has to name the file rather than report a
    # complete configuration with a default value silently substituted.
    include /etc/nginx/lab-tuning.conf;

    # web02 is TLSv1.2+. This node still accepts TLSv1 and TLSv1.1, and the
    # ssl_ciphers line below is the 2016 copy-paste that goes with it.
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    gzip on;
    gzip_types application/json text/css;

    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*.conf;
}
