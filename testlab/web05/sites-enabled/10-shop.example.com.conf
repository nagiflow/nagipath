# shop.example.com on web05 — web02's twin, and the reason the fleet view exists.
#
# Read this next to web02/sites-enabled/10-shop.example.com.conf. It is not a
# rewrite; it is the same file with pieces missing and one piece added. Every
# difference below was a reasonable local change at the time.

server {
    listen 8080;

    # web02 serves shop.example.com only. This node also answers for
    # admin.example.com on plain HTTP, on the same port, with the same document
    # root — so the admin hostname is reachable unencrypted through be_app even
    # though the :8443 block below exists to serve it over TLS.
    server_name shop.example.com admin.example.com;

    # web02 sets X-Frame-Options DENY here. This node does not, so the header is
    # served by half the pool. A browser sees it or does not depending on which
    # member roundrobin picked, which is the worst possible way for a security
    # header to behave.
    add_header X-Served-By web05;

    # web02 has `limit_conn` and a server-scope `limit_req` here. Neither is on
    # this node, so this member absorbs the whole rate a limited member would shed.

    # web02 routes 502/503/504 to @maintenance. This node has no error_page at
    # all, so a request that reaches the dead upstream returns nginx's stock 502 —
    # with the version number in it, because server_tokens is on.

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    location ^~ /assets/ {
        root /usr/share/nginx/html;
        # web02 sets expires 1y and Cache-Control immutable here. Absent, so this
        # member serves the same asset with no caching headers.
        try_files $uri =404;
    }

    location ~ \.php$ {
        return 404;
    }

    # The route nobody remembers adding. It proxies straight to the address
    # nothing listens on, it is not behind any allow/deny, and its name suggests
    # what it was for. web02 has no equivalent, so it is reachable through
    # be_app for exactly half of requests.
    location /debug/ {
        proxy_pass http://10.90.4.7:8443;
    }

    # An unauthenticated status endpoint. web02 keeps stub_status on :8090 behind
    # an allow/deny; this node exposes it on the port the load balancer sends
    # public traffic to.
    location = /nginx_status {
        stub_status;
    }

    location /api/ {
        add_header X-Api-Version 2;
        proxy_set_header Host $host;

        # Identical text to web02's line. Different destination, because
        # app_backend on this node is 10.90.4.7:8443 and on web02 it is app01:8080.
        # This is the case that defeats comparing configuration as text.
        proxy_pass http://app_backend/;
    }

    location /api-raw/ {
        add_header X-Api-Version 2;
        proxy_pass http://app_backend;
    }

    # web02's copy of this location rejects non-internal clients. It does here
    # too — except `set_real_ip_from` is missing from this node's maps, so
    # $remote_addr is lb01's address, the /8 in the geo block matches it, and the
    # check passes for every request that arrives through the load balancer. The
    # directive is present, correct, and has no effect.
    location /api/v2/admin/ {
        limit_req zone=api_write burst=5 nodelay;

        if ($internal_client = 0) {
            return 403 "admin api is internal only\n";
        }

        include /etc/nginx/snippets/proxy-defaults.conf;
        proxy_pass http://app_backend/admin/;
    }

    location /api-channel/ {
        include /etc/nginx/snippets/proxy-defaults.conf;
        proxy_pass http://$api_pool/;
    }

    location /account/ {
        auth_request     /_auth;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        proxy_set_header X-Auth-User $auth_user;
        include /etc/nginx/snippets/proxy-defaults.conf;
        proxy_pass http://session_backend/account/;
    }

    location = /_auth {
        internal;
        proxy_pass              http://auth_backend/verify;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        X-Original-URI $request_uri;
    }

    # web02 caches /catalog/ from asset_backend. This node has no asset_backend,
    # so the location proxies to app_backend instead — a different pool, a
    # different cache size, and the same URL.
    location /catalog/ {
        proxy_cache        api_cache;
        proxy_cache_valid  200 1m;
        add_header X-Cache-Status $upstream_cache_status;
        include /etc/nginx/snippets/proxy-defaults.conf;
        proxy_pass http://app_backend/catalog/;
    }

    # web02 has /grpc/, /legacy/, /ws/, /protected-files/, /ops/, /media/ and
    # /old-api/. None of them exist here. A request for any of them falls through
    # to `location /` below and gets 404 or the index page, from one member of the
    # pool only.

    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }
}
