# admin.example.com over TLS on web05, and three certificate problems in one
# server block.
#
#   1. The certificate is issued for other.example.com. nginx starts happily and
#      only an inventory that reads the certificate alongside the server_name
#      notices — a browser notices too, but only after someone visits.
#   2. The same hostname is served over plain HTTP by the :8080 block in
#      10-shop.example.com.conf, so the TLS here is optional in practice.
#   3. lb01 terminates TLS for admin.example.com from a certificate that does not
#      cover it either, so the hostname has two certificates and neither is right.
#
# The http-scope ssl_protocols on this node still permits TLSv1, so this listener
# is the one that accepts it.

server {
    listen 8443 ssl;
    server_name admin.example.com;

    # The certificate here is issued for other.example.com. Nothing in this file
    # says so and nginx starts happily; only an inventory that reads the
    # certificate alongside the server_name catches it.
    ssl_certificate     /etc/ssl/lab/admin.crt;
    ssl_certificate_key /etc/ssl/lab/admin.key;

    # Client certificates are requested and not required, so `ssl_verify_client
    # optional` plus no check on $ssl_client_verify means the mTLS here is
    # decorative. The directive is present; nothing acts on the result.
    ssl_verify_client optional_no_ca;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Served-By web05-tls;

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    # An admin surface with basic auth against a file that does not exist on this
    # node. web02 ships /etc/nginx/htpasswd; this one does not, so every request
    # here is a 500 rather than a 401 — a failure mode that looks like an outage
    # and is a missing file.
    location /admin/ {
        auth_basic           "web05 admin";
        auth_basic_user_file /etc/nginx/htpasswd;
        proxy_pass http://app_backend/admin/;
    }

    location / {
        root /usr/share/nginx/html;
    }
}
