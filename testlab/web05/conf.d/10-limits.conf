# The zones web05 declares. web02 declares six and uses four; this node declares
# four and uses one, so most of the rate limiting web02 applies is simply absent
# here — the pool is limited to 30r/s on one member and unlimited on the other.

limit_req_zone  $binary_remote_addr  zone=per_ip:10m    rate=30r/s;
limit_req_zone  $binary_remote_addr  zone=api_write:10m rate=5r/s;

# web02 also has per_site and per_token. Neither exists here, and
# sites-enabled/10-shop.example.com.conf on this node therefore has no
# server-scope limit at all.

limit_conn_zone $binary_remote_addr  zone=conn_per_ip:10m;

limit_req_status  503;
limit_conn_status 503;

# The same cache name as web02, a tenth of the size and a much shorter inactive
# window. Identically named caches with different capacities is how a pool ends
# up with wildly different hit rates and nobody can say why.
proxy_cache_path /var/cache/nginx/api
                 levels=1:2
                 keys_zone=api_cache:2m
                 inactive=1m
                 max_size=64m;

proxy_cache_key "$scheme$request_method$host$request_uri";
