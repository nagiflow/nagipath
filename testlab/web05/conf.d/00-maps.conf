# web05's copy of web02's maps. Compare the two files side by side: this is the
# version from before the partner regex was added and before the canary channel
# existed.
#
# The `$api_pool` map here has no `canary` entry, so a request carrying
# `X-Api-Channel: canary` gets app_backend on this node and app_canary on web02.
# Same header, same pool, two destinations — and nothing in either file says so.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# No partner regex. The third line of web02's map is missing, so a partner
# subdomain gets no CORS header from this node and does from the other.
map $http_origin $cors_origin {
    default                      '';
    'https://shop.example.com'   $http_origin;
    'https://admin.example.com'  $http_origin;
}

# One entry short of web02's.
map $http_x_api_channel $api_pool {
    default  app_backend;
    stable   app_backend;
}

map $http_cookie $skip_cache {
    default        0;
    '~*sessionid=' 1;
}

map $request_method $is_write {
    default  1;
    GET      0;
    HEAD     0;
    OPTIONS  0;
}

# The office range web02 trusts is 10.90.0.0/16. This one is a /8, which trusts
# every private address on the network — including anything that gets a lease on
# it. A wider netmask is the least visible of the drifts here and the worst.
geo $internal_client {
    default      0;
    10.0.0.0/8   1;
    127.0.0.0/8  1;
}

# web02 also trusts lb01 as a proxy via set_real_ip_from. This node does not, so
# $remote_addr here is always lb01's address — which makes the geo block above
# evaluate against the load balancer instead of the client, and every
# `if ($internal_client = 0)` on this node therefore passes.
real_ip_header X-Forwarded-For;
