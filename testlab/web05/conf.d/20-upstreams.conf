# web05's upstreams. Same names as web02's, different members, and that is the
# whole problem: a Route on this node and a Route on web02 both say
# `proxy_pass http://app_backend/` and go to different places.
#
# An inventory keyed on the directive text would call these identical. Keying on
# the resolved Upstream Members is what makes the difference visible.

# app01:8080 on web02. Nothing listens on 10.90.4.7 at all, so half of be_app is
# a dead end and the load balancer's health check — which tests *this* node, not
# its upstream — reports the node healthy the whole time.
upstream app_backend {
    server 10.90.4.7:8443;
}

# The canary pool web02 has. On this node the name exists and points at the same
# dead address, so the canary channel is broken here in a way that only shows up
# for requests carrying the header.
upstream app_canary {
    server 10.90.4.7:8443;
}

upstream session_backend {
    ip_hash;
    server 10.90.4.7:8443;
}

# web02 balances this across two members with least_conn. Here it is one member
# with no balancing method and no keepalive, so the auth subrequest opens a new
# connection every time.
upstream auth_backend {
    server 10.90.4.7:8443;
}

# web02's asset_backend and grpc_backend do not exist on this node. Any location
# that referenced them would fail the config test, which is why the site file
# below has fewer locations rather than broken ones — silent absence rather than
# a loud error, and much harder to notice.
