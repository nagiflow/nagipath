# Partner vhosts, defined through mod_macro.
#
# This is the file to look at when asking what an inventory is *for*. Grep it for
# `<VirtualHost` and you find one occurrence, inside a macro body. Apache expands
# the macro three times and runs three vhosts. The configuration text and the
# running configuration disagree about how many sites exist on this node, and the
# text is the one that is wrong.
#
# nagipath does not expand macros. It reports what it parsed — one <VirtualHost>
# inside a <Macro> — and `httpd -D DUMP_INCLUDES` tells it this file is part of
# the configuration, so the discrepancy is visible rather than silent. Guessing at
# macro expansion would mean reimplementing Apache's parser, and being subtly
# wrong about it is worse than declining.

<IfModule macro_module>

<Macro PartnerVHost $name $upstream $ratelimit>
<VirtualHost *:8080>
    ServerName  $name.partner.example.com
    ServerAlias $name-api.partner.example.com

    DocumentRoot "/usr/local/apache2/htdocs"

    CustomLog /proc/self/fd/1 fleet
    CustomLog /usr/local/apache2/logs/access_log fleet

    Header always set X-Partner "$name"
    Header always set X-Frame-Options "DENY"

    <IfModule ratelimit_module>
        <Location "/">
            SetOutputFilter RATE_LIMIT
            SetEnv rate-limit $ratelimit
            Require all granted
        </Location>
    </IfModule>

    <Location "/api/">
        Require all granted
        Header set X-Served-By "app01 (partner $name)"
    </Location>

    <IfModule proxy_module>
        ProxyPass        "/api/" "$upstream"
        ProxyPassReverse "/api/" "$upstream"
    </IfModule>

    <LocationMatch "^/(admin|internal)/">
        Require all denied
    </LocationMatch>
</VirtualHost>
</Macro>

# Three vhosts, three rate limits, two of them sharing an upstream. None of this
# appears as a <VirtualHost> in the text above these lines.
Use PartnerVHost acme     http://10.90.4.20:8080/api/  256
Use PartnerVHost globex   http://10.90.4.20:8080/api/  512
Use PartnerVHost initech  http://10.90.4.25:8080/api/  128

# Defined and never used. The macro exists, expands to nothing, and reads as
# though a staging vhost is configured.
<Macro StagingVHost $name>
<VirtualHost *:8080>
    ServerName $name.staging.example.com
    DocumentRoot "/usr/local/apache2/htdocs"
    Header always set X-Environment "staging"
    <Location "/">
        Require ip 10.90.0.0/16
    </Location>
</VirtualHost>
</Macro>

UndefMacro StagingVHost

</IfModule>
