# The origin's own TLS listener, and the certificate finding the lab did not have
# before: a certificate three days from expiry, on the tier nobody watches.
#
# lb01's shop.example.com certificate has 20 days and is the one an operator
# thinks about, because it is the one a browser sees. This one is internal, so
# nothing external will warn about it, and when it expires the edge-to-origin leg
# fails for every request while the public certificate is still perfectly valid.
#
# It is also issued for app01.internal.example.com and served for
# origin.example.com, which is the same SAN mismatch web05 has — the point being
# that it is a pattern, not a one-off, and a fleet-wide certificate inventory
# finds both from one query.

<IfModule ssl_module>

SSLRandomSeed startup builtin
SSLRandomSeed connect builtin
SSLSessionCache shmcb:/usr/local/apache2/logs/ssl_scache(512000)
SSLSessionCacheTimeout 300
SSLCipherSuite HIGH:!aNULL:!MD5:!3DES
SSLHonorCipherOrder off
SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

<VirtualHost *:8443>
    ServerName origin.example.com

    SSLEngine on
    SSLCertificateFile    /etc/ssl/lab/app01-internal.crt
    SSLCertificateKeyFile /etc/ssl/lab/app01-internal.key

    # Client certificates requested and not verified. `SSLVerifyClient optional`
    # with nothing reading %{SSL_CLIENT_VERIFY} is mTLS that authenticates
    # nobody — the same decorative-mTLS pattern as web05's nginx block, in Apache
    # spelling.
    SSLVerifyClient optional_no_ca
    SSLVerifyDepth  1

    DocumentRoot "/usr/local/apache2/htdocs"
    CustomLog /proc/self/fd/1 fleet
    CustomLog /usr/local/apache2/logs/access_log fleet

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Served-By "app01 (TLS origin)"

    # Only the edge is supposed to reach this. `Require ip` on the load balancer's
    # address is the whole control, and mod_remoteip is trusting that same address
    # for X-Forwarded-For — so a client that sets the header controls what this
    # rule sees. Two directives, three files apart, that cancel each other out.
    <Location "/">
        Require ip 10.90.4.10
        Require ip 10.90.0.0/16
    </Location>

    <Location "/v2/">
        Require all granted
        Header set X-Served-By "app01 (TLS, Location, rank 80)"
    </Location>
</VirtualHost>

</IfModule>
