# shop.example.com on app01 — the origin the trace ends at.
#
# This is the first <VirtualHost *:8080> Apache sees, which makes it the default
# for that port: a request arriving with a Host header no vhost claims is served
# by this one. There is no `_default_` here and no 444 equivalent, so unlike
# web02's nginx this node answers for hostnames it was never configured for.

<VirtualHost *:8080>
    ServerName  shop.example.com
    ServerAlias www.shop.example.com
    ServerAlias shop.internal.example.com

    DocumentRoot "/usr/local/apache2/htdocs"

    ErrorLog  /proc/self/fd/2
    CustomLog /proc/self/fd/1 fleet env=!dontlog
    CustomLog /usr/local/apache2/logs/access_log fleet env=!dontlog

    # ---------------------------------------------------------------- rewrites
    #
    # RewriteRule runs in the URL-mapping phase, before any <Location> or
    # <Directory> section is chosen. So a rewrite here decides which section
    # matches — the sections do not decide the rewrite. Reading the <Location>
    # blocks below without reading these four lines gives the wrong answer for
    # every path they touch.
    <IfModule rewrite_module>
        RewriteEngine On

        # Two conditions ANDed, then a rewrite. `[L]` stops this round of rules;
        # it does not stop the request, and the rewritten URL is matched against
        # sections as if it had arrived that way.
        RewriteCond %{HTTP_HOST}   ^shop\.internal\.example\.com$ [NC]
        RewriteCond %{REQUEST_URI} !^/internal/
        RewriteRule ^/(.*)$ /internal/$1 [L]

        # A conditional block that only fires for a header the edge sets. The
        # destination depends on a request header, so it is a branch, not a route.
        RewriteCond %{HTTP:X-Api-Channel} =canary
        RewriteRule ^/svc/(.*)$ /svc-canary/$1 [L]

        # An external redirect. The request leaves the fleet and comes back as a
        # new one, so the Trace ends here rather than continuing.
        RewriteRule ^/old/(.*)$ https://shop.example.com/$1 [R=301,L]

        # Rewrite to a proxy. `[P]` hands the request to mod_proxy from inside the
        # rewrite engine, which is a proxy hop that no ProxyPass line declares —
        # the most easily missed reverse-proxy configuration in Apache.
        RewriteCond %{REQUEST_URI} ^/legacy-api/
        RewriteRule ^/legacy-api/(.*)$ http://10.90.4.20:8080/api/$1 [P,L]
        ProxyPassReverse "/legacy-api/" "http://10.90.4.20:8080/api/"

        # Blocks a method rather than a path. A rule with no path component at all.
        RewriteCond %{REQUEST_METHOD} ^(TRACE|TRACK|DEBUG)$
        RewriteRule .* - [F]
    </IfModule>

    # ----------------------------------------------------------------- sections
    #
    # /v2/charge matches this and the <Directory> in httpd.conf. Apache takes the
    # higher-ranked section, so this header is the one that survives.
    <Location "/v2/">
        Require all granted
        Header set X-Served-By "app01 (Location, rank 80)"
    </Location>

    # Ranked equal to <Location> and later in the file, so for a path both match
    # this one wins. It matches /v2/internal/... and deliberately not /v2/charge —
    # a regex section that changes the answer for a sibling path and not for this
    # one is exactly the case that has to be got right rather than approximated.
    <LocationMatch "^/v2/(internal|debug)/">
        Require ip 10.90.0.0/16
        Header set X-Served-By "app01 (LocationMatch, rank 80, later)"
    </LocationMatch>

    <Files "*.bak">
        Require all denied
    </Files>

    # ----------------------------------------------------------------- proxying
    #
    # ProxyPass is first-match-wins, unlike the sections above. The three
    # exclusions in conf.d/20-balancers.conf are earlier in the merged
    # configuration and therefore win, which is why /assets/ is served from disk
    # despite the broader rules here.
    <IfModule proxy_module>
        # A balancer target takes no per-ProxyPass tuning — `connectiontimeout` here
        # is "unknown Balancer parameter" and refuses to start. The tuning belongs
        # on BalancerMember or ProxySet in conf.d/20-balancers.conf, two files away
        # from the line that looks like it should carry it.
        ProxyPass        "/svc/"        "balancer://svc_pool/"
        ProxyPassReverse "/svc/"        "balancer://svc_pool/"

        # Not a balancer, so the same parameters are accepted here.
        ProxyPass        "/svc-canary/" "http://10.90.4.25:8080/svc/" connectiontimeout=3 timeout=10
        ProxyPassReverse "/svc-canary/" "http://10.90.4.25:8080/svc/"

        ProxyPass        "/reports/"    "balancer://report_pool/"
        ProxyPassReverse "/reports/"    "balancer://report_pool/"

        ProxyPass        "/queue/"      "balancer://queue_pool/"
        ProxyPassReverse "/queue/"      "balancer://queue_pool/"

        # Regex proxying with a capture. The destination is built from the request
        # path, so there is no fixed target to record — the pattern is the answer.
        ProxyPassMatch "^/tenant/([a-z0-9-]+)/(.*)$" "http://10.90.4.20:8080/tenants/$1/$2"

        # FastCGI. A terminal hop that is not HTTP, to a socket that is not
        # listening, so it also fails in a way a health check will not show.
        ProxyPassMatch "^/app/(.*\.php)$" "unix:/run/php/php-fpm.sock|fcgi://localhost/srv/app/$1"

        # WebSocket. Different scheme, and the tunnel bypasses every output filter
        # and Header directive above it.
        ProxyPass "/socket/" "ws://10.90.4.20:8080/ws/"
    </IfModule>

    # ------------------------------------------------------------------- access
    <Location "/reports/">
        AuthType Basic
        AuthName "app01 reports"
        AuthUserFile /usr/local/apache2/conf/htpasswd
        # `Require any` of the two, so an office address needs no password. The
        # three lines read as though both are required.
        <RequireAny>
            Require valid-user
            Require ip 10.90.0.0/16
        </RequireAny>
    </Location>

    <Location "/queue/">
        # Both must hold. The <RequireAll> is one word different from the
        # <RequireAny> six lines above and means the opposite.
        <RequireAll>
            Require valid-user
            Require not ip 10.90.4.7
        </RequireAll>
        AuthType Basic
        AuthName "app01 queue"
        AuthUserFile /usr/local/apache2/conf/htpasswd
    </Location>

    <Directory "/usr/local/apache2/htdocs/assets">
        Options -Indexes +FollowSymLinks
        Require all granted
        Header set Cache-Control "public, max-age=2592000, immutable"
    </Directory>

    Alias "/static/" "/usr/local/apache2/htdocs/"

    <Location "/health">
        SetHandler default-handler
        Require all granted
    </Location>
</VirtualHost>
