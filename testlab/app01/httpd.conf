# app01 — the origin, and the reason the lab has an Apache node at all. Apache
# merges matching sections in rank order and the last one wins, so <Location>
# beats <Directory>. nginx does the opposite: first match wins. A trace engine
# that shares one rule for both is wrong on one of them.
#
# The layout is a real Apache estate's: httpd.conf holds modules and global
# defaults, and everything that decides what happens to a request is in conf.d/
# and sites-enabled/. Apache has no `-T`, so nagipath discovers this tree from
# `httpd -D DUMP_INCLUDES` rather than from a rendered configuration — which
# means an `IncludeOptional` that matches nothing is invisible unless the
# collection says so.

ServerRoot "/usr/local/apache2"
Listen 8080
Listen 8443

# --------------------------------------------------------------------- modules
#
# Every module here is load-bearing for something below. mod_macro in particular:
# sites-enabled/30-partners.conf defines vhosts through a macro, so the vhosts
# that file creates do not appear as <VirtualHost> blocks in its text at all.
LoadModule mpm_event_module          modules/mod_mpm_event.so
LoadModule unixd_module              modules/mod_unixd.so
LoadModule authn_core_module         modules/mod_authn_core.so
LoadModule authn_file_module         modules/mod_authn_file.so
LoadModule auth_basic_module         modules/mod_auth_basic.so
LoadModule authz_core_module         modules/mod_authz_core.so
LoadModule authz_host_module         modules/mod_authz_host.so
LoadModule authz_user_module         modules/mod_authz_user.so
LoadModule dir_module                modules/mod_dir.so
LoadModule mime_module               modules/mod_mime.so
LoadModule alias_module              modules/mod_alias.so
LoadModule headers_module            modules/mod_headers.so
LoadModule rewrite_module            modules/mod_rewrite.so
LoadModule log_config_module         modules/mod_log_config.so
LoadModule logio_module              modules/mod_logio.so
LoadModule env_module                modules/mod_env.so
LoadModule setenvif_module           modules/mod_setenvif.so
LoadModule filter_module             modules/mod_filter.so
LoadModule deflate_module            modules/mod_deflate.so
LoadModule expires_module            modules/mod_expires.so
LoadModule unique_id_module          modules/mod_unique_id.so
LoadModule remoteip_module           modules/mod_remoteip.so
LoadModule reqtimeout_module         modules/mod_reqtimeout.so
LoadModule ratelimit_module          modules/mod_ratelimit.so
LoadModule status_module             modules/mod_status.so
LoadModule macro_module              modules/mod_macro.so
LoadModule substitute_module         modules/mod_substitute.so
LoadModule socache_shmcb_module      modules/mod_socache_shmcb.so
LoadModule ssl_module                modules/mod_ssl.so
LoadModule proxy_module              modules/mod_proxy.so
LoadModule proxy_http_module         modules/mod_proxy_http.so
LoadModule proxy_fcgi_module         modules/mod_proxy_fcgi.so
LoadModule proxy_wstunnel_module     modules/mod_proxy_wstunnel.so
LoadModule proxy_balancer_module     modules/mod_proxy_balancer.so
LoadModule slotmem_shm_module        modules/mod_slotmem_shm.so
LoadModule lbmethod_byrequests_module modules/mod_lbmethod_byrequests.so
LoadModule lbmethod_bytraffic_module  modules/mod_lbmethod_bytraffic.so

User  daemon
Group daemon

ServerName   app01.lab
ServerAdmin  ops@example.com
ServerTokens Prod
ServerSignature Off
DocumentRoot "/usr/local/apache2/htdocs"

TraceEnable Off
Timeout 60
KeepAlive On
MaxKeepAliveRequests 200
KeepAliveTimeout 5
RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500

# lb01 sets X-Forwarded-For. Without RemoteIPHeader every Require ip below would
# be evaluated against the load balancer's address instead of the client's, which
# is the same trap web05's nginx falls into for the same reason.
RemoteIPHeader X-Forwarded-For
RemoteIPTrustedProxy 10.90.4.10

ErrorLog  /proc/self/fd/2
LogLevel  warn

LogFormat "%h %l %u %t \"%r\" %>s %b" common
LogFormat "%a %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
# The format nagipath needs to Verify a Hop on this node: it carries the request
# id lb01 generated, the vhost the request was served by, and the Probe's own
# correlation token. LogFormatGap (probe.go) only checks for %v, so a format with
# %v but no %{X-Nagipath-Probe}i passes that check silently while still leaving
# every Hop through this node stuck at Inferred — this field is what closes that.
LogFormat "%v %a %t \"%r\" %>s %b %D \"%{X-Request-ID}i\" %{UNIQUE_ID}e %{X-Nagipath-Probe}i" fleet
CustomLog /proc/self/fd/1 fleet
# A second copy to a real file: /proc/self/fd/1 is a pipe to `docker logs`, and a
# pipe has nothing for nagipath to tail — the same problem nginx's stock
# access.log symlink has, fixed the same way (see Dockerfile.node). This is what
# the sudoers NAGIPATH_LAB_LAYOUT grant for /usr/local/apache2/logs/* reads.
CustomLog /usr/local/apache2/logs/access_log fleet

TypesConfig    conf/mime.types
DirectoryIndex index.html

# ------------------------------------------------------------- global defaults
#
# <Directory /> denies everything, and every grant below is an exception to it.
# This is the correct order and the reason a missing Require in a later section
# fails closed rather than open.
<Directory />
    AllowOverride none
    Require all denied
    Options None
</Directory>

<Directory "/usr/local/apache2/htdocs">
    Options FollowSymLinks
    AllowOverride None
    Require all granted
    Header set X-Served-By "app01 (Directory, rank 50)"
</Directory>

# Dotfiles and editor leftovers, denied fleet-wide. <FilesMatch> ranks above
# <Directory> and below <Location>, so this beats the grant above and loses to
# any <Location> that grants — which is a three-way precedence interaction that
# no amount of reading one section explains.
<FilesMatch "^\.|~$|\.(bak|orig|swp|sql|env)$">
    Require all denied
</FilesMatch>

# The order of these two Includes decides which sections rank last, and Apache's
# "last matching section wins" makes that ordering semantic rather than cosmetic.
#
# Absolute paths, deliberately. A relative Include is resolved against ServerRoot,
# which on this image is /usr/local/apache2 and not the directory httpd.conf is
# in — so `IncludeOptional conf.d/*.conf` would look in /usr/local/apache2/conf.d,
# find nothing, and load nothing. With IncludeOptional that is not an error and
# `httpd -t` still says Syntax OK, which is how an entire configuration tree goes
# missing in silence. Spelling the paths out removes the ambiguity.
IncludeOptional /usr/local/apache2/conf/conf.d/*.conf
IncludeOptional /usr/local/apache2/conf/sites-enabled/*.conf

# This one genuinely matches nothing, which is the same silence on purpose. A
# collection that did not report the unmatched pattern would leave an operator
# certain a policy was in force.
IncludeOptional /usr/local/apache2/conf/conf.d/local-overrides/*.conf
