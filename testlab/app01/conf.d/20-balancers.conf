# Balancer pools, declared at server scope and used from vhosts in
# sites-enabled/. This is Apache's equivalent of an nginx `upstream`, with the
# same consequence for a Trace: a request routed to a balancer has as many
# possible next hops as the pool has members, and the configuration does not say
# which one serves it.
#
# The difference from nginx is that the pool is declared in a <Proxy> section
# whose name is a URL, and the ProxyPass that uses it names that URL again. Two
# places, no cross-reference, and a typo in either produces a 500 at request time
# rather than a config error.

<IfModule proxy_balancer_module>
    # Round-robin by request count. Both members are real destinations.
    #
    # The timeouts live here and not on the ProxyPass that names this pool, because
    # a ProxyPass whose target is a balancer:// URL rejects worker parameters
    # outright ("ProxyPass unknown Balancer parameter") and refuses to start. So the
    # tuning for /svc/ is two files away from the line that routes /svc/.
    <Proxy "balancer://svc_pool">
        BalancerMember "http://10.90.4.20:8080" loadfactor=10 retry=5 timeout=10 connectiontimeout=3
        BalancerMember "http://10.90.4.25:8080" loadfactor=10 retry=5 timeout=10 connectiontimeout=3
        ProxySet lbmethod=byrequests stickysession=JSESSIONID|jsessionid nofailover=Off
    </Proxy>

    # Weighted by traffic, with one member drained. `status=D` is administrative
    # state held in configuration — the pool has two members and serves from one,
    # and there is nothing in the running state to explain why.
    <Proxy "balancer://report_pool">
        BalancerMember "http://10.90.4.20:8080" loadfactor=90 timeout=120
        BalancerMember "http://10.90.4.25:8080" loadfactor=10 timeout=120 status=D
        ProxySet lbmethod=bytraffic
    </Proxy>

    # A pool with exactly one member and a hot standby. The standby only takes
    # traffic when the first fails, so it is a destination that appears in no
    # normal request and is still part of the topology.
    <Proxy "balancer://queue_pool">
        BalancerMember "http://10.90.4.20:8080"
        BalancerMember "http://10.90.4.7:8080" status=+H
        ProxySet lbmethod=byrequests
    </Proxy>
</IfModule>

# Proxy defaults. `ProxyPreserveHost On` means the origin sees the client's Host
# rather than the member's, which changes which vhost on the far side serves the
# request — a routing decision made by one boolean, three files away from the
# vhost it affects.
ProxyPreserveHost On
ProxyRequests Off
ProxyTimeout 30
ProxyBadHeader Ignore

# Reverse-proxy exclusions. `ProxyPass ... !` is the mechanism for "everything
# except", and it only works because it appears *before* the broader ProxyPass in
# sites-enabled/ — Apache takes the first ProxyPass that matches, which is the
# opposite of how its <Location> sections merge. Two precedence rules in one
# server, and getting them the wrong way round is the most common Apache
# reverse-proxy bug.
<IfModule proxy_module>
    ProxyPass "/health"        "!"
    ProxyPass "/server-status" "!"
    ProxyPass "/assets/"       "!"
</IfModule>
