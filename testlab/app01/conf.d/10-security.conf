# Fleet-wide response headers and access policy. Loaded before sites-enabled/, so
# every section here ranks *earlier* than every section in a vhost — and with
# Apache's last-match-wins merge, earlier means weaker.
#
# `Header set` from a vhost <Location> therefore replaces what is set here, while
# `Header always set` and `Header setifempty` do not. Three spellings of the same
# directive with three different merge behaviours, which is the Apache equivalent
# of nginx's add_header discard.

<IfModule headers_module>
    # `always` puts these in the error-response table too, so a 500 carries them.
    # A plain `set` would not, and a security header missing from exactly the
    # responses that leak stack traces is the usual outcome.
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Permitted-Cross-Domain-Policies "none"

    # Overridable on purpose: a vhost that needs to be framed can `Header set`
    # over it. Which means it is not a guarantee, and reading only this file
    # suggests it is.
    Header set X-Frame-Options "SAMEORIGIN"

    # Set only if the origin did not set it. The vhost that sets its own wins.
    Header setifempty Cache-Control "no-store"

    Header unset X-Powered-By
    Header unset X-AspNet-Version

    # The request id lb01 generated, echoed back so a client can quote it in a
    # ticket. This is the other half of the correlation the `fleet` log format
    # depends on.
    Header always set X-Request-ID "%{X_REQUEST_ID}e" env=X_REQUEST_ID
</IfModule>

<IfModule setenvif_module>
    SetEnvIf X-Request-ID "^(.+)$" X_REQUEST_ID=$1
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    SetEnvIf Request_URI "\.(gif|jpe?g|png|css|js|woff2?)$" STATIC_ASSET=1
    # Health checks are excluded from the access log, which also excludes them
    # from anything nagipath could verify a Probe against.
    SetEnvIf Request_URI "^/health$" dontlog
</IfModule>

<IfModule deflate_module>
    AddOutputFilterByType DEFLATE text/html text/plain text/css
    AddOutputFilterByType DEFLATE application/json application/javascript
    DeflateCompressionLevel 6
</IfModule>

<IfModule expires_module>
    ExpiresActive On
    ExpiresDefault "access plus 1 hour"
    ExpiresByType text/css "access plus 30 days"
    ExpiresByType application/javascript "access plus 30 days"
    ExpiresByType image/png "access plus 30 days"
</IfModule>

<IfModule ratelimit_module>
    # Bandwidth, not request rate. It is easy to read this as the rate limit the
    # edge applies and it is a completely different control.
    <Location "/downloads/">
        SetOutputFilter RATE_LIMIT
        SetEnv rate-limit 512
        Require all granted
    </Location>
</IfModule>

# Server status, restricted by address. mod_remoteip is loaded, so `Require ip`
# here sees the real client — which is why the RemoteIPTrustedProxy line in
# httpd.conf is a security control and not a logging convenience.
<IfModule status_module>
    <Location "/server-status">
        SetHandler server-status
        Require ip 10.90.0.0/16
        Require ip 127.0.0.0/8
    </Location>
</IfModule>
