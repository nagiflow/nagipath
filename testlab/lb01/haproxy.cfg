# lb01 — the fleet edge. TLS terminates here and everything downstream is plain
# HTTP, which is the arrangement nagipath has to describe correctly: a trace that
# reported hop 2 as encrypted would be wrong in the direction that matters.
#
# This file is deliberately the size and shape of a real edge configuration.
# HAProxy has no `include`, so an enterprise edge is one long file with a section
# layout that has to be read as a whole — which is the point. Everything below is
# a pattern nagipath has to survive:
#
#   named `defaults` blocks   frontends inheriting different defaults by position
#   resolvers / server-template  backends whose membership is DNS, not config text
#   stick-tables / peers      rate limiting whose state is shared, not local
#   http-errors / errorfile   responses that never reach a backend at all
#   cache                     responses served by the edge itself
#   userlist                  authentication that lives in the config file
#   mode tcp `listen`         a proxy hop with no HTTP semantics to reason about
#   map_str routing           a use_backend whose target is a file lookup
#
# The last one matters most: it is a route nagipath cannot resolve from
# configuration alone, and must say so rather than guess.

global
    log stdout format raw local0
    maxconn 20000
    nbthread 4
    hard-stop-after 5m

    # A stats socket is how an operator changes a server's state without a reload.
    # It also means the running configuration and this file can disagree, which is
    # exactly the drift a snapshot-based inventory is for.
    stats socket /var/run/haproxy.sock mode 660 level admin expose-fd listeners
    stats timeout 30s

    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-options ssl-min-ver TLSv1.2
    tune.ssl.default-dh-param 2048

    setenv FLEET_SITE lab

# ------------------------------------------------------------------ resolvers
#
# 127.0.0.11 is Docker's embedded DNS. In production this is the site resolver,
# and the reason it is here is `server-template` below: a backend whose members
# come from DNS has no member list in this file. An inventory that only reads
# configuration has to report that honestly.
resolvers site_dns
    nameserver docker 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid    10s
    hold nx       5s
    hold timeout  5s
    hold refused  5s

# ------------------------------------------------------------------- userlist
#
# Credentials in the configuration file. nagipath models this as an Opaque
# Directive: it is searchable as text and never interpreted, because interpreting
# it would mean storing what it contains.
userlist ops_users
    group admins
    user statsviewer password $5$xL9kQm2p$FKurInfUI29GDUSKoGDWzHnuD3aB5MIxGgskt9IpAf0 groups admins

# ---------------------------------------------------------------------- peers
#
# Stick-table state shared across the edge tier. With one edge node the section
# is inert; it is here because a two-node edge is the normal case and the section
# changes what the rate limits below actually mean.
peers edge_tier
    peer lb01 10.90.4.10:10000

# ---------------------------------------------------------------------- cache
#
# The edge answers some requests itself. A cached response is a Trace that stops
# at hop 1, which is a shorter answer than the configuration suggests.
cache static_edge
    total-max-size 64
    max-object-size 262144
    max-age 300

# ---------------------------------------------------------------- http-errors
#
# Error pages served from disk. `use_backend be_maintenance` below reaches a
# backend with no servers on purpose, so the response comes from here.
http-errors lab_errors
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/503.http

# ------------------------------------------------------------------- defaults
#
# Two named defaults blocks. HAProxy applies whichever one most recently
# preceded a section, so the *position* of a frontend in this file changes its
# timeouts. That is a property of the file, not of the frontend, and it is the
# kind of thing that is invisible when reading a single section in isolation.
defaults http_edge
    mode    http
    log     global
    option  httplog
    option  forwardfor except 127.0.0.0/8
    option  http-server-close
    option  redispatch
    retries 3
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    timeout http-request 10s
    timeout http-keep-alive 4s
    timeout queue 30s
    errorfiles lab_errors
    default-server inter 3s fall 3 rise 2 slowstart 20s

defaults tcp_edge
    mode    tcp
    log     global
    option  tcplog
    timeout connect 5s
    timeout client  1h
    timeout server  1h

# =========================================================== public frontend
#
# Positioned after `defaults tcp_edge`, so `mode http` has to be restated. An
# edge that relied on inheritance here would be serving TCP.
frontend fe_public
    mode http
    bind :80
    bind :443 ssl crt /etc/ssl/lab/shop.pem alpn h2,http/1.1

    # Reachability check for an upstream load balancer. It never reaches a
    # backend, so it is a request this fleet answers without any hop at all.
    monitor-uri /haproxy-up

    # Every request gets an id, and it is the only correlation key between this
    # log line and the origin's. nagipath's Probe verification depends on the
    # origin's access log carrying something the Probe can be matched on.
    http-request set-header X-Request-ID %[uuid()] unless { req.hdr(X-Request-ID) -m found }
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http  unless { ssl_fc }
    http-request set-header X-Edge-Node lb01

    capture request  header Host          len 64
    capture request  header X-Request-ID  len 40
    capture response header Content-Type  len 32

    acl is_shop    hdr(host) -i shop.example.com
    acl is_admin   hdr(host) -i admin.example.com
    acl is_static  path_beg /assets/
    acl is_api     path_beg /api/
    acl is_health  path /health
    acl from_office src 10.90.0.0/16 192.168.0.0/16
    acl is_write   method POST PUT PATCH DELETE
    acl has_bearer req.hdr(Authorization) -m beg -i Bearer
    acl edge_maint nbsrv(be_app) eq 0

    # Rate limiting with shared state. The table is per-source; the two tracking
    # lines fill it and the deny reads it. A request denied here never becomes a
    # hop, which is why the deny is above every use_backend.
    stick-table type ip size 200k expire 5m store http_req_rate(10s),conn_cur peers edge_tier
    http-request track-sc0 src unless from_office
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 200 }
    http-request deny deny_status 429 if is_write { sc_http_req_rate(0) gt 40 }

    # Plain HTTP is redirected, so the :80 listener is a redirect and not a
    # second way into the fleet. A trace that treated it as one would be wrong.
    http-request redirect scheme https code 301 unless { ssl_fc } or is_health

    # Writes to the API require a token at the edge. This is an access-control
    # Rule that terminates a Trace, and it is three lines above the route it
    # affects rather than inside it.
    http-request deny deny_status 401 if is_api is_write !has_bearer

    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains" if { ssl_fc }
    http-response set-header X-Edge-Request-ID %[capture.req.hdr(1)]
    http-response del-header Server
    http-response del-header X-Powered-By

    # The edge answers static assets from its own cache when it can.
    http-request cache-use static_edge if is_static
    http-response cache-store static_edge

    # Both of these are conditional on an ACL, and an ACL is a property of the
    # request, not of the configuration. nagipath lists them as branches it will
    # not guess at rather than picking one and sounding certain.
    use_backend be_static if is_static
    use_backend be_admin  if is_admin

    # A backend selected because the fleet is unhealthy, not because the request
    # asked for it. Undetermined for a different reason than the two above: the
    # condition is fleet state, which no amount of configuration reading settles.
    use_backend be_maintenance if edge_maint

    default_backend be_app

# ==================================================== partner frontend (map)
#
# Routing by file lookup. There is no `use_backend x if y` here to follow: the
# backend name is the result of reading host-backend.map at request time. This is
# a common enterprise pattern and it is genuinely unresolvable from configuration
# text, which is the honest answer nagipath has to give instead of a guess.
frontend fe_partner
    mode http
    bind :8080

    acl known_partner req.hdr(host),lower,map_str(/etc/haproxy/maps/host-backend.map) -m found

    http-request set-header X-Partner-Route %[req.hdr(host),lower,map_str(/etc/haproxy/maps/host-backend.map,unknown)]
    http-request deny deny_status 404 unless known_partner

    use_backend %[req.hdr(host),lower,map_str(/etc/haproxy/maps/host-backend.map,be_app)]

# ====================================================== mutual-TLS frontend
#
# Client certificates. The interesting part for an inventory is that this
# frontend's `crt` is the same file as fe_public's, so one certificate's exposure
# spans two frontends with completely different trust requirements.
frontend fe_admin_mtls
    mode http
    bind :9443 ssl crt /etc/ssl/lab/shop.pem ca-file /etc/ssl/lab/shop.crt verify optional

    acl has_client_cert ssl_c_used
    acl cert_ok         ssl_c_verify eq 0

    # nginx would answer 496/495 here; haproxy only serves status codes it has an
    # error page for, so both client-certificate failures collapse into one 403.
    http-request deny deny_status 403 unless has_client_cert
    http-request deny deny_status 403 unless cert_ok
    http-request set-header X-Client-DN %{+Q}[ssl_c_s_dn]

    default_backend be_admin

# ======================================================== TCP passthrough
#
# `mode tcp`, so there is no host, no path and no header to reason about. A hop
# here is a hop with no HTTP semantics, and a trace that invented some would be
# describing a request that does not exist.
listen tcp_postgres
    mode tcp
    bind :5432
    balance source
    option tcp-check
    server pg01 10.90.4.7:5432 check backup

# ============================================================ stats endpoint
#
# Authenticated against the userlist above. It exposes the running state, which
# is the thing a configuration snapshot cannot see.
listen st_stats
    mode http
    bind :8404
    stats enable
    stats uri /
    stats refresh 10s
    stats show-node
    stats http-request auth realm lb01 unless { http_auth(ops_users) }

# =============================================================== backends
#
# be_app is the documented path: two members, and nagipath follows both rather
# than picking the one roundrobin happens to choose next.
backend be_app
    mode http
    balance leastconn

    # Session affinity by inserted cookie. It makes which member serves a request
    # a property of the client, not of the configuration — so both members stay
    # in the trace.
    cookie SRVID insert indirect nocache httponly secure

    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host shop.example.com
    http-check expect status 200

    http-request set-header X-Origin-Pool be_app

    server web02 web02:8080 check cookie w02 weight 100
    server web05 web05:8080 check cookie w05 weight 100

backend be_admin
    mode http
    balance first
    option httpchk
    http-check send meth GET uri /health
    server web05 web05:8080 check cookie w05

# Static assets, with the edge cache in front and a long expiry behind.
backend be_static
    mode http
    balance roundrobin
    http-response set-header Cache-Control "public, max-age=86400, immutable"
    server web02 web02:8080 check

# A canary split by weight. The 5/95 is in the configuration, but which request
# lands where is not, so both members are real destinations.
backend be_api_canary
    mode http
    balance roundrobin
    server web02_stable web02:8080 check weight 95
    server web05_canary web05:8080 check weight 5

# Membership from DNS, not from this file. `server-template` expands to three
# server slots whose addresses are whatever site_dns returns; `init-addr none`
# lets haproxy start when it returns nothing. There is no member list here to
# inventory, and saying so is more useful than reporting zero members.
backend be_partner_dynamic
    mode http
    balance roundrobin
    server-template partner 3 partner.svc.lab:8080 check resolvers site_dns init-addr none

# No servers, on purpose. A request routed here is answered by http-errors above,
# so the Trace ends at the edge with a 503 and no origin involved.
backend be_maintenance
    mode http
    errorfiles lab_errors
    http-request return status 503 content-type text/plain string "shop.example.com is in maintenance\n"

backend be_pg
    mode tcp
    server pg01 10.90.4.7:5432 check
